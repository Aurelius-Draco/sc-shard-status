name: release
# Publish a release on GitHub (Releases, Draft a new release, new tag like v3.1)
# and this builds the download zip, attaches it, and fills in the notes from
# CHANGELOG.md. Pushing a tag like v1.0 does the same without the website.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
# Publishing on the website also creates the tag, so both events can fire; run them one after the other
# (the second finds the release already there and just re-uploads the same zip).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the zip and notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          git archive --format=zip --prefix=SC-Shard-Status/ -o "SC-Shard-Status-${VER}.zip" HEAD
          awk -v v="## ${VER}" 'index($0, v)==1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** download `SC-Shard-Status-Setup-%s.exe` below and run it. Windows may say it protected your PC the first time: click **More info**, then **Run anyway**. Already have it? The app offers the update itself.\n\nPrefer to run it from source? `SC-Shard-Status-%s.zip` is the same app for Python 3.12 or 3.13: unzip it and double-click **Setup.bat**.\n' "$VER" "$VER" >> notes.md
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="SC-Shard-Status-${VER}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "$ZIP" --title "SC Shard Status ${VER}" --notes-file notes.md
          fi
  # The Windows installer, built and tested on a clean Windows machine, then attached to the same release
  installer:
    needs: release
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.ref_name }}
  # Tell the Discord server about the new version (only when the repo has a DISCORD_WEBHOOK secret)
  discord:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOOK" ]; then echo "No DISCORD_WEBHOOK secret; skipping."; exit 0; fi
          VER="${TAG#v}"
          jq -n --arg v "$VER" --arg url "https://github.com/${{ github.repository }}/releases/tag/$TAG" '{username: "Verse Shards", avatar_url: "https://verseshards.com/img/verse-shards-icon.png",
            allowed_mentions: {parse: []}, embeds: [{title: ("SC Shard Status " + $v + " is out"), url: $url, color: 5031088,
            description: ("Already have it? The app offers the update on its dashboard. New to it? Download at https://verseshards.com/app\n\nWhat changed: " + $url)}]}' \
            | curl -fsS -H "content-type: application/json" -d @- "$HOOK"
