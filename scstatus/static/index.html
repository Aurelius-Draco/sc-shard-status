.refcard b { font-size: 1.25rem; } .refcard .rtext span { color: var(--muted); font-size: .9375rem; }
.refcard .rcode { display: grid; gap: var(--s2); }
.refcard .rrow { display: flex; gap: var(--s2); align-items: stretch; }
.refcard code { font: 600 1.25rem/1 var(--mono); letter-spacing: .04em; padding: var(--s3) var(--s4); border: 1px dashed var(--amber); border-radius: var(--r); background: var(--field); color: var(--amber); white-space: nowrap; }
.refcard .rrow .btn { height: auto; }
table.sb .fps-low { font-size: .8125rem; }
.refcard .rcode > .btn { width: 100%; }
.abwrap .muted { color: var(--muted); }
:root { --t-label: 600 .8125rem/1.1rem var(--font); }
.abwrap .ab-ref { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s4) var(--s6); border-bottom: 1px solid var(--amber-line); }
.abwrap .ab-ref .rcode { min-width: 0; }
@media (max-width: 760px) { .abwrap .ab-ref { grid-template-columns: 1fr; } }

/* ===== Set up: systems check + grouped cards ===== */
.sghud { margin-top: var(--s5); }
.sgg { grid-template-columns: 10rem repeat(8, minmax(0, 1fr)); }
@media (max-width: 1200px) { .sgg { grid-template-columns: repeat(5, minmax(0, 1fr)); } .sgg .gscore { grid-row: span 2; } }
@media (max-width: 700px) { .sgg { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sgg .gscore { grid-row: auto; grid-column: 1 / -1; } }
.gbig small { font-size: 1.125rem; color: var(--muted); font-weight: 600; }
a.sgc { text-decoration: none; color: var(--text); cursor: pointer; transition: background .15s; } a.sgc:hover { background: var(--raise); color: var(--text); }
.sgv { display: flex; align-items: center; gap: 8px; font: 600 1rem/1.2 var(--font); }
.sgv i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line2); }
.sgc.on .sgv i { background: var(--st-good); box-shadow: 0 0 8px rgba(76,196,176,.6); }
.sgc.warn .sgv i { background: var(--amber); box-shadow: 0 0 8px rgba(242,169,59,.55); animation: youPulse 2.4s ease-in-out infinite; } .sgc.warn .sgv { color: var(--amber); }
.sgc.off .sgv { color: var(--muted); }
.sgshare { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border: 1px dashed rgba(242,169,59,.6); border-radius: var(--r); background: var(--amber-bg); }
.sgshare p { margin: 0; } .sgshare .txl i { background: rgba(242,169,59,.25); box-shadow: inset 0 0 0 1.5px var(--amber); animation: youPulse 2.4s ease-in-out infinite; }
@media (max-width: 640px) { .sgshare { grid-template-columns: auto 1fr; } .sgshare .btn { grid-column: 2; justify-self: start; } }
.sgnav { position: sticky; top: 3rem; z-index: 5; display: flex; gap: 4px; margin-top: var(--s4); padding: var(--s2) 0; overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.sgnav::-webkit-scrollbar { display: none; }
.sgnav a { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); font-size: .8125rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.sgnav a:hover { color: var(--text); border-color: var(--amber); background: var(--amber-bg); }
.sgroup { margin: var(--s7) 0 0; font: 700 .875rem/1.2 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-stretch: semi-condensed; display: flex; align-items: center; gap: var(--s3); }
.sgroup::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--amber-line), transparent); }
.setcard { position: relative; padding: var(--s5) var(--s5) var(--s5) calc(var(--s5) + 4px); gap: var(--s3); scroll-margin-top: 7rem; }
.setcard::before { content: ""; position: absolute; left: 0; top: var(--s4); bottom: var(--s4); width: 3px; border-radius: 0 2px 2px 0; background: var(--line2); }
.setcard:has(.state.on)::before, .setcard:has(.onoff [data-v="1"][aria-pressed="true"])::before { background: var(--st-good); }
.setcard h4 { font-size: 1.125rem; display: flex; align-items: center; gap: var(--s2); }
.setcard p, .setcard li { color: var(--muted); } .setcard p b, .setcard li b { color: var(--text); }
.cmd { font-size: 1rem; padding: var(--s3) var(--s4); background: #05070a; border-color: var(--line2); color: #d9e1ea; width: fit-content; }
.cmd::before { content: "›"; color: var(--amber); font-weight: 700; }
code.cmdsm { background: #05070a; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--line); }
.swlist { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.swrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: var(--s3) var(--s4); border-top: 1px solid var(--line); background: var(--well); }
.swrow:first-child { border-top: 0; } .swrow .swl { display: grid; gap: 2px; }
.onoff { border-radius: 99px; } .onoff button { min-width: 3.75rem; height: 2rem; }
.onoff button[data-v="1"][aria-pressed="true"] { background: var(--st-good); color: #06231e; }
#commCard { border-color: rgba(242,169,59,.5); background: radial-gradient(700px 200px at 100% 0, var(--amber-bg), transparent 60%), var(--panel); }
#commCard:has(.onoff [data-sw="share"][data-v="1"][aria-pressed="true"]) { border-color: rgba(76,196,176,.45); background: radial-gradient(700px 200px at 100% 0, var(--teal-bg), transparent 60%), var(--panel); }
#commCard pre.lines { max-height: 16rem; overflow: auto; }
.setcard .tscroll { max-height: none; overflow-x: auto; overflow-y: visible; }
.setcard table.switches { width: 100%; } .setcard table.switches td { padding: var(--s3); }
.setcard table.switches td:last-child { white-space: nowrap; }
/* use the full card width: no 80ch cap, commands never wrap, no inner scrollbars */
.setcard p, .setcard li, .setcard .intro { max-width: none; }
.setcard ul.rules { max-width: none; columns: 2 26rem; column-gap: var(--s6); }
.setcard ul.rules li { break-inside: avoid; margin-bottom: var(--s2); }
.cmd, code.cmdsm, .setcard code { white-space: nowrap; }
.setcard .tscroll { overflow: visible !important; max-height: none !important; }
.setcard table.switches th, .setcard table.switches td { white-space: nowrap; }
.setcard table.switches td:first-child { white-space: normal; }
@media (max-width: 900px) { .setcard .tscroll { overflow-x: auto !important; } }
/* commands and their USER.cfg state sit on one line */
.setcard .cmd + p { margin-top: 0; }
.setcard .fa { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.setcard table.switches td:last-child .state { margin-right: var(--s2); vertical-align: middle; }

/* ===== v3 type floor (brief section 1): small text at least 14px, labels and buttons at least 13px. Port with the design-pass block. ===== */
.brand p, .tl .t, code, pre.lines, summary, .dchip, .hint, .achip, .dopt, .gform label, .gform .lbl, .hme, small, .about a, .foot, .gtime .sub span, output { font-size: .875rem; }
.sub span, .sub b, .sub a, .sub code { font-size: inherit; }
.btn.sm, .seg button, .count, .chip, th, .sevl, .gl, .plab, .ab-eye, li.day, .gn, dt, .tabbar .count, .eyebrow { font-size: .8125rem; }
.chart .axis text { font-size: 13px; }
.sgg .gl, .hg .gl { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.2; }
.rhd h4, .tl .x, .tl li.day, .wq .qn, .cnt, .bestmove .eyebrow, .pirate .plab, .pc-stats dt, .where dt, .pline.pbig .plab, .gscore .gl, .ab-road b, .tip b { font-size: .8125rem; }
.refcard small { font-size: .8125rem; }
.ab-orgt code, .ab-ov, .ab-ov span, .ab-ov small, .about-sub, details.why > summary, .chatbox details.ex > summary { font-size: .875rem; }
/* ===== Blueprints, Your sessions, Your game settings: Claude Design round, 8 Nov 2026 (reference/round.css, ported as one block).
   Tokens are set on .vr (not :root) so the companion's own tokens and light theme are left alone; these pieces are dark only.
   Port as one block. Uses the companion's existing tokens (same names as the site). Everything has a still version under reduced motion. */
.vr {
  --bg: #0b0e12; --panel: #12161c; --card: #0e1217; --raise: #1e242c; --line: #262d36; --line2: #3a434f;
  --text: #e7eaee; --muted: #c3cad3; --soft: #d5dae1;
  --amber: #f2a93b; --gold: #ffd166; --teal: #4cc4b0; --teal-hi: #b5f5e9; --rust: #ec7a5e; --rust-text: #f4a48f; --steel: #a9c0d8;
  --on-amber: #1a1103; --on-teal: #06231e;
  --bp: #163a63; --bp-line: #9fd0ff; --bp-ink: #e7f3ff;
  --font: "Bahnschrift", "Barlow", "Segoe UI", system-ui, sans-serif;
  --cond: "Bahnschrift SemiCondensed", "Barlow Semi Condensed", "Bahnschrift", sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --ease-out: cubic-bezier(.2,.8,.2,1);
}
.vr { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.vr *, .vr *::before, .vr *::after { box-sizing: border-box; }
.vr a { color: var(--teal); } .vr a:hover { color: var(--amber); }
.vr :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.vr .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.vr-h { margin: 0; font: 700 22px/1.2 var(--cond); letter-spacing: .02em; }
.vr-label { font: 700 12px/1.2 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.vr-sub { font-size: 14px; color: var(--muted); }
.vr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line2);
  background: var(--raise); color: var(--text); font: 600 14px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
.vr-btn:hover { border-color: var(--amber); color: var(--text); }
.vr-btn.is-primary { border: 0; background: var(--amber); color: var(--on-amber); font-weight: 700; }
.vr-btn.is-primary:hover { filter: brightness(1.08); color: var(--on-amber); }
.vr-btn.is-quiet { background: transparent; }
.vr-btn:disabled { opacity: .55; cursor: not-allowed; border-color: var(--line2); }
.vr-btn.is-sm { height: 32px; padding: 0 11px; font-size: 13px; }
.vr-inp { height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line2); background: #0c0f13; color: var(--text); font: 14px var(--font); min-width: 0; }
.vr-inp:focus { border-color: var(--amber); outline: none; }
.vr-chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; font: 700 11px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.vr-chip > i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.vr-note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: rgba(18,22,28,.7); font-size: 13px; line-height: 1.5; color: var(--muted); }
.vr-note svg { flex: none; width: 16px; height: 16px; margin-top: 1px; stroke: var(--steel); }
.vr-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 24px; border-radius: 12px; border: 1px dashed var(--line2); text-align: center; }
.vr-empty b { font: 700 20px var(--cond); }

/* ---------------- 1. Blueprints ---------------- */
.bp-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.bp-total { font: 800 34px/1 var(--cond); }
.bp-total small { font: 600 15px var(--font); color: var(--muted); margin-left: 8px; }
.bp-top .vr-inp { flex: 1 1 260px; max-width: 360px; }
.bp-groups { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-gchip { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line2); background: transparent; color: var(--text); font: 600 13px var(--font); cursor: pointer; }
.bp-gchip b { color: var(--muted); font-weight: 600; margin-left: 4px; }
.bp-gchip[aria-pressed="true"] { border-color: var(--amber); background: rgba(242,169,59,.14); }
.bp-sec { display: flex; flex-direction: column; gap: 10px; }
.bp-sec-h { display: flex; align-items: baseline; gap: 10px; }
.bp-sec-h h3 { margin: 0; font: 700 14px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bp-sec-h span { font-size: 13px; color: var(--muted); }
.bp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }

/* the card: blueprint mark + name, gold edge, dark glass, sized to its words */
.bp-card { --x: 0; --y: 0; position: relative; display: block; width: 100%; padding: 1.5px; border: 0; border-radius: 12px; cursor: pointer; text-align: left;
  background: linear-gradient(135deg, rgba(242,169,59,.95), rgba(242,169,59,.22) 38%, rgba(255,255,255,.05) 62%, rgba(255,209,102,.5));
  box-shadow: 0 10px 24px rgba(0,0,0,.45); perspective: 600px;
  transition: transform .5s var(--ease-out), box-shadow .3s; font: inherit; color: inherit; }
.bp-in { position: relative; display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 9px 12px 9px 10px; border-radius: 10.5px; overflow: hidden;
  background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,0) 45%), rgba(14,18,23,.94); }
.bp-mark { flex: none; width: 34px; height: 34px; transition: transform .5s var(--ease-out); }
.bp-name { min-width: 0; font: 600 14px/1.3 var(--font); overflow-wrap: anywhere; }
.bp-tagline { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.bp-sheen { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; mix-blend-mode: screen;
  background: radial-gradient(circle at calc(50% + var(--x) * 50%) calc(50% + var(--y) * 50%), rgba(242,169,59,.28), transparent 55%),
    linear-gradient(calc(110deg + var(--x) * 20deg), transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%); }
.bp-card:hover, .bp-card.is-hover, .bp-card:focus-visible {
  transform: translateY(-2px) rotateX(calc(var(--y) * -6deg)) rotateY(calc(var(--x) * 8deg));
  box-shadow: 0 16px 32px rgba(0,0,0,.5), 0 0 26px rgba(242,169,59,.28); }
.bp-card:hover .bp-sheen, .bp-card.is-hover .bp-sheen, .bp-card:focus-visible .bp-sheen { opacity: 1; }
.bp-card:hover .bp-mark, .bp-card.is-hover .bp-mark { transform: translateZ(10px) rotate(-6deg) scale(1.06); }
.bp-card:focus-visible { outline-offset: 2px; }
/* wanted: dashed, the mark is only drawn in outline */
.bp-card.is-wanted { background: none; box-shadow: none; outline: 1.5px dashed rgba(242,169,59,.7); outline-offset: -1.5px; }
.bp-card.is-wanted .bp-in { background: rgba(14,18,23,.6); }
.bp-card.is-wanted .bp-mark { opacity: .7; }
.bp-card.is-wanted .bp-mark .bp-fill { fill: none; }
.bp-card.is-wanted:hover, .bp-card.is-wanted.is-hover { outline-color: var(--amber); box-shadow: 0 10px 24px rgba(0,0,0,.4); }
.bp-x { flex: none; margin-left: auto; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: 13px; }
.bp-x:hover { color: var(--text); border-color: var(--rust); }
.bp-wtag { margin-left: auto; flex: none; color: var(--amber); }
/* just received: gold flash, a ring bursts out of the mark, a New chip stays for the session */
.bp-card.is-new { animation: bp-got 1.4s var(--ease-out) 1; }
.bp-card.is-new .bp-mark { animation: bp-mark-got 1.4s var(--ease-out) 1; }
.bp-card.is-new .bp-in::after { content: ""; position: absolute; left: 27px; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
  border: 2px solid var(--gold); opacity: 0; animation: bp-ring 1.4s ease-out .15s 1; pointer-events: none; }
.bp-new { margin-left: auto; flex: none; background: var(--gold); color: var(--on-amber); }
.bp-card.is-frozen, .bp-card.is-frozen * { animation-play-state: paused !important; }

/* want list */
.bp-want { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; border: 1px solid rgba(242,169,59,.35); background: rgba(242,169,59,.05); }
.bp-want form { display: flex; gap: 8px; flex-wrap: wrap; }
.bp-want form .vr-inp { flex: 1 1 220px; }

/* details */
.vr-scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(4,6,9,.72); animation: vr-fade .2s ease-out; }
.vr-dialog { position: relative; width: min(520px, 100%); max-height: calc(100vh - 48px); overflow: auto; padding: 1.5px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(242,169,59,.95), rgba(242,169,59,.2) 40%, rgba(255,209,102,.5)); box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: vr-pop .3s var(--ease-out); }
.vr-dialog.is-wide { width: min(980px, 100%); }
.vr-dialog > div { border-radius: 14.5px; background: var(--card); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.vr-close { position: absolute; top: 12px; right: 12px; z-index: 1; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raise); color: var(--text); cursor: pointer; font-size: 15px; }
.bp-det-head { display: flex; align-items: center; gap: 14px; padding-right: 40px; }
.bp-det-head .bp-mark { width: 56px; height: 56px; }
.bp-det-head h2 { margin: 0; font: 800 24px/1.15 var(--cond); }
.vr-dl { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 10px 16px; margin: 0; font-size: 15px; }
.vr-dl dt { color: var(--muted); font: 700 12px/1.6 var(--cond); letter-spacing: .1em; text-transform: uppercase; }
.vr-dl dd { margin: 0; }

/* toast */
.vr-toast { position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 10px;
  background: #1a1f27; border: 1px solid rgba(255,209,102,.6); box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 30px rgba(255,209,102,.2); font-size: 15px; animation: vr-pop .3s var(--ease-out); }
.vr-toast .bp-mark { width: 28px; height: 28px; }

/* ---------------- 2. Your sessions ---------------- */
.ss-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
@media (max-width: 1100px) { .ss-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .ss-grid { grid-template-columns: minmax(0, 1fr); } }
.ss-card { --hc: var(--teal); position: relative; display: block; width: 100%; padding: 1.5px; border: 0; border-radius: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  background: linear-gradient(135deg, color-mix(in srgb, var(--hc) 90%, transparent), color-mix(in srgb, var(--hc) 18%, transparent) 40%, rgba(255,255,255,.05) 65%, color-mix(in srgb, var(--hc) 40%, transparent));
  box-shadow: 0 14px 34px rgba(0,0,0,.45); transition: transform .4s var(--ease-out), box-shadow .3s; }
.ss-card:hover, .ss-card:focus-visible { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(0,0,0,.5), 0 0 30px color-mix(in srgb, var(--hc) 25%, transparent); }
.ss-card[data-h="ok"] { --hc: var(--steel); } .ss-card[data-h="poor"] { --hc: var(--gold); } .ss-card[data-h="bad"] { --hc: var(--rust); } .ss-card[data-h="none"] { --hc: #6b7684; }
.ss-card.is-live { background: linear-gradient(90deg, var(--teal), rgba(76,196,176,.15), var(--teal-hi), rgba(76,196,176,.15), var(--teal)); background-size: 300% 100%; animation: ss-live 2.6s linear infinite; }
.ss-in { height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px 16px; border-radius: 12.5px;
  background: radial-gradient(120% 80% at 100% 0, color-mix(in srgb, var(--hc) 10%, transparent), transparent 60%), var(--card); }
.ss-head { display: flex; align-items: flex-start; gap: 14px; }
.ss-when { flex: 1; min-width: 0; }
.ss-day { font: 800 21px/1.1 var(--cond); letter-spacing: .01em; }
.ss-time { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.ss-ring { flex: none; position: relative; display: block; width: 66px; height: 66px; }
.ss-ring svg { display: block; width: 66px; height: 66px; transform: rotate(-90deg); }
.ss-ring .trk { stroke: var(--line); } .ss-ring .arc { stroke: var(--hc); stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease-out); }
.ss-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 22px/1 var(--cond); }
.ss-word { font: 700 11px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--hc); text-align: center; margin-top: 4px; }
.ss-noscore { width: 66px; height: 66px; border-radius: 50%; border: 2px dashed var(--line2); display: grid; place-items: center; font: 800 20px var(--cond); color: var(--muted); }
.ss-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ss-stats li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; border-radius: 8px; background: rgba(30,36,44,.55); border: 1px solid var(--line); font-size: 13px; line-height: 1.3; }
.ss-stats li.is-wide { grid-column: 1 / -1; }
.ss-stats svg { flex: none; width: 16px; height: 16px; stroke: var(--muted); }
.ss-stats b { font-weight: 700; }
.ss-stats .is-bad b { color: var(--rust-text); } .ss-stats .is-bad svg { stroke: var(--rust-text); }
.ss-stats .is-gold svg { stroke: var(--gold); }
.ss-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; font-size: 13px; color: var(--muted); }
.ss-rate { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-weight: 600; }
.ss-rate.is-good { background: rgba(76,196,176,.14); color: var(--teal); } .ss-rate.is-bad { background: rgba(236,122,94,.14); color: var(--rust-text); }
.ss-live-chip { background: var(--teal); color: var(--on-teal); } .ss-live-chip > i { animation: ss-dot 1.2s ease-in-out infinite; }
.ss-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; }
.ss-pager span { font-size: 14px; color: var(--muted); min-width: 110px; text-align: center; }
.ss-quiet { font-size: 13.5px; color: var(--muted); line-height: 1.5; }

/* full report */
.ss-rep-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-right: 40px; }
.ss-rep-head .ss-ring, .ss-rep-head .ss-ring svg { width: 92px; height: 92px; } .ss-rep-head .ss-ring b { font-size: 30px; }
.ss-rep-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .ss-rep-grid { grid-template-columns: minmax(0, 1fr); } }
.ss-box { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(18,22,28,.7); }
.ss-rows { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.ss-rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ss-rows li:first-child { border-top: 0; }
.ss-rows .rep { font-size: 13px; color: var(--muted); white-space: nowrap; }
.ss-res { font: 700 11px var(--cond); letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.ss-res.is-completed { background: rgba(76,196,176,.14); color: var(--teal); } .ss-res.is-failed { background: rgba(236,122,94,.14); color: var(--rust-text); } .ss-res.is-abandoned { background: rgba(169,192,216,.14); color: var(--steel); }
.ss-prob li { grid-template-columns: 64px minmax(0, 1fr) auto; }
.ss-prob .t { font: 600 13px var(--mono); color: var(--muted); }
.ss-rating { display: flex; gap: 8px; flex-wrap: wrap; }
.ss-rating button[aria-pressed="true"].is-good { border-color: var(--teal); background: rgba(76,196,176,.14); }
.ss-rating button[aria-pressed="true"].is-bad { border-color: var(--rust); background: rgba(236,122,94,.14); }
.ss-auec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ss-auec label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.ss-diff { font: 700 18px var(--cond); }
.ss-diff.is-made { color: var(--teal); } .ss-diff.is-spent { color: var(--rust-text); }

/* ---------------- 3. Your game settings ---------------- */
.vr .gs { display: flex; flex-direction: column; gap: 16px; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); }
.vr .gs[data-s="differs"] { border-color: rgba(242,169,59,.55); }
.gs-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.gs-head > div { flex: 1 1 280px; }
.gs-saved { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; color: var(--muted); }
.gs-saved svg { width: 16px; height: 16px; stroke: var(--teal); }
.gs-copies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1000px) { .gs-copies { grid-template-columns: minmax(0, 1fr); } }
.gs-copy { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(14,18,23,.8); }
.gs-copy-h { display: flex; align-items: center; gap: 8px; }
.gs-copy-h b { font: 800 16px var(--cond); letter-spacing: .06em; }
.gs-st { font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
.gs-st i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.gs-copy.is-match .gs-st i { background: var(--teal); } .gs-copy.is-match .gs-st { color: var(--teal); }
.gs-copy.is-differs { border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.06); }
.gs-copy.is-differs .gs-st i { background: var(--amber); animation: gs-flag 2.4s ease-out infinite; } .gs-copy.is-differs .gs-st { color: var(--amber); }
.gs-copy.is-never .gs-st, .gs-copy.is-unsaved .gs-st { color: var(--muted); } .gs-copy.is-never .gs-st i, .gs-copy.is-unsaved .gs-st i { background: var(--line2); }
.gs-copy-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.gs-wait { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.gs-confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(242,169,59,.5); background: rgba(242,169,59,.07); font-size: 14px; line-height: 1.45; }
.gs-confirm code { font: 12.5px var(--mono); color: var(--soft); overflow-wrap: anywhere; }
.gs-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .gs-groups { grid-template-columns: minmax(0, 1fr); } }
.gs-group { border-radius: 10px; border: 1px solid var(--line); background: rgba(14,18,23,.7); padding: 10px 14px; }
.gs-group h4 { margin: 0 0 4px; font: 700 12px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.gs-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.gs-row:first-of-type { border-top: 0; }
.gs-row .v { font-weight: 700; color: var(--text); white-space: nowrap; }
.gs-row .d { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.gs-row.is-diff { background: rgba(242,169,59,.06); }
.gs-row.is-diff .v { color: var(--amber); }
.gs-binds summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 8px 0; }
.gs-binds ul { margin: 0; padding: 0 0 4px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; font-size: 13px; color: var(--soft); }
.gs-binds kbd { font: 600 12px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line2); background: var(--raise); color: var(--text); }
/* flag on the Now tab */
.gs-flag { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(242,169,59,.5); background: rgba(242,169,59,.07); font-size: 14px; }
.gs-flag > i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; animation: gs-flag 2.4s ease-out infinite; }
.gs-flag span { flex: 1 1 260px; }

/* ---------------- keyframes ---------------- */
@keyframes bp-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes bp-got { 0% { box-shadow: 0 0 0 0 rgba(255,209,102,0), 0 10px 24px rgba(0,0,0,.45); } 25% { box-shadow: 0 0 34px 6px rgba(255,209,102,.55), 0 10px 24px rgba(0,0,0,.45); } 100% { box-shadow: 0 0 0 0 rgba(255,209,102,0), 0 10px 24px rgba(0,0,0,.45); } }
@keyframes bp-mark-got { 0% { transform: scale(.4) rotate(-30deg); } 45% { transform: scale(1.22) rotate(6deg); } 70% { transform: scale(.96) rotate(-2deg); } 100% { transform: none; } }
@keyframes bp-ring { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.6); } }
@keyframes ss-live { from { background-position: 0% 50%; } to { background-position: 300% 50%; } }
@keyframes ss-dot { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes gs-flag { 0% { box-shadow: 0 0 0 0 rgba(242,169,59,.7); } 70% { box-shadow: 0 0 0 8px rgba(242,169,59,0); } 100% { box-shadow: 0 0 0 0 rgba(242,169,59,0); } }
@keyframes vr-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes vr-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.bp-grid > *, .ss-grid > * { animation: bp-in .45s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 25ms); }

@media (prefers-reduced-motion: reduce) {
  .vr *, .vr *::before, .vr *::after, .vr-scrim, .vr-dialog, .vr-toast { animation: none !important; transition: none !important; }
  .bp-card:hover, .bp-card.is-hover, .bp-card:focus-visible, .ss-card:hover, .ss-card:focus-visible { transform: none; }
  .bp-card.is-new { box-shadow: 0 0 0 2px var(--gold), 0 10px 24px rgba(0,0,0,.45); }
  .ss-card.is-live { background: var(--teal); }
}
.vr.is-calm *, .vr.is-calm *::before, .vr.is-calm *::after { animation: none !important; transition: none !important; }
.vr.is-calm .bp-card:hover, .vr.is-calm .bp-card.is-hover, .vr.is-calm .ss-card:hover { transform: none; }
.vr.is-calm .bp-card.is-new { box-shadow: 0 0 0 2px var(--gold), 0 10px 24px rgba(0,0,0,.45); }
.vr.is-calm .ss-card.is-live { background: var(--teal); }

/* 900 px fixes */
.bp-gchip { white-space: nowrap; flex: none; }
.bp-top { flex-wrap: wrap; }
.bp-top .vr-inp { flex: 1 1 200px; min-width: 0; max-width: 360px; }
.vr .bp-tab, .vr .bp-top, .vr .bp-groups { min-width: 0; max-width: 100%; }

.ss-auec { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ss-auec label { min-width: 0; }
.ss-auec .vr-inp { width: 100%; min-width: 0; }
@media (max-width: 1000px) { .ss-rep-grid { grid-template-columns: minmax(0, 1fr); } }

/* port: the round came in dark only. In the light theme its pieces sit on a dark panel so they read; light versions are asked of Claude Design */
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sec.vr { background: #0b0e12; padding: 20px; border-radius: 14px; color-scheme: dark; } }
:root[data-theme="light"] .sec.vr { background: #0b0e12; padding: 20px; border-radius: 14px; color-scheme: dark; }
/* port: a just-received card flashes once; when the tab redraws (search, groups) it keeps its New chip without flashing again */
.bp-card.is-new.is-seen, .bp-card.is-new.is-seen .bp-mark { animation: none; }
.bp-card.is-new.is-seen .bp-in::after { display: none; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="15" cy="15" r="12"/><path d="M5 17h5l3-7 4 12 3-7h5" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
    <div><h1>Verse Shards</h1><p>for PC · v__VERSION__</p></div>
  </div>
  <span class="stat" id="shardPill"><i></i><span>No shard yet</span></span>
  <span class="stat" id="ovPill" title="Reading the game's debug overlay"><i></i><span>Overlay</span></span>
  <span class="grow"></span>
  <button type="button" class="pill plink upd" data-protected="true" id="updPill" hidden></button>
  <button type="button" class="btn sm ghost" data-protected="true" id="markBtn" title="Something just went wrong? Mark it and keep playing. What's gone wrong? looks at this moment later.">Mark this moment</button>
  <a class="hlink" href="https://verseshards.com" target="_blank" rel="noopener" title="Live shard board, known issues, Issue Council links and workarounds">verseshards.com ↗</a>
</header>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="now" aria-selected="true">Now</button>
  <button role="tab" data-tab="check">What's gone wrong? <span class="count rust" id="findCount"></span></button>
  <button role="tab" data-tab="timeline">Timeline</button>
  <button role="tab" data-tab="groups">Groups <span class="count" id="grpCount"></span></button>
  <button role="tab" data-tab="history">History</button>
  <button role="tab" data-tab="blueprints">Blueprints</button>
  <button role="tab" data-tab="pc">My pilot</button>
  <button role="tab" data-tab="issues">Known issues <span class="count" id="libCount"></span></button>
  <button role="tab" data-tab="setup" class="t2 tsetup"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Set up <i class="dot" id="setupDot" hidden></i></button>
  <button role="tab" data-tab="about">About</button>
</nav>

<main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="dTitle">
  <div class="dh"><div class="eyebrow" id="dEyebrow">Issue Council draft</div><h2 id="dTitle"></h2><button class="close" id="dClose" aria-label="Close">✕</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 0) => v === null || v === undefined ? "–" : Number(v).toFixed(d);
const tm = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const dtm = ts => ts ? new Date(ts * 1000).toLocaleString([], {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
const ago = ts => { if (!ts) return ""; const s = Date.now() / 1000 - ts; if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago"; };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {"X-Token": TOKEN}} :
    {method: "POST", headers: {"X-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, err) {
  document.querySelectorAll("body > .toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

let tab = "now", nowData = null, lastCheck = null, timer = null, autoCheck = false;
try { tab = sessionStorage.getItem("tab") || "now"; } catch (e) {}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => show(b.dataset.tab));

function show(t) {
  tab = t;
  try { sessionStorage.setItem("tab", t); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  clearInterval(timer);
  const fn = {now: renderNow, check: renderCheck, timeline: renderTimeline, history: renderHistory, blueprints: renderBlueprints, groups: renderGroups, pc: renderPC, issues: renderIssues, setup: renderSetup, about: renderAbout}[t] || renderNow;
  Promise.resolve().then(fn).catch(e => {
    if (tab === t) $("view").innerHTML = `<div class="empty"><h3>Couldn't load this page</h3><p>${esc(e.message)}. Is the SC Shard Status window still open?</p></div>`;
  });
  if (t === "groups") timer = setInterval(drainBars, 60000);
  if (t === "now") timer = setInterval(() => {
    // Don't rebuild the page under someone reading a tooltip or a report
    if (document.querySelector("#view .tip:not([hidden])") || $("drawer").classList.contains("open")) return;
    renderNow();
  }, 5000);
}

/* ---------- header ---------- */
function header(d) {
  const sp = $("shardPill"), op = $("ovPill");
  const sh = d.shard || {};
  sp.className = "stat" + (sh.id ? " on" : "");
  sp.querySelector("span").textContent = sh.id ? `${sh.name || sh.id} · ${sh.region}` : (d.game_found ? "Not in the PU yet" : "Game.log not found");
  sp.title = sh.id || "";
  const st = d.overlay_status || "off";
  op.className = "stat" + (st === "reading" ? " on" : st === "off" ? "" : " warn");
  op.querySelector("span").textContent = st === "reading" ? "Overlay reading" : st === "off" ? "Overlay off" : st.startsWith("overlay off") ? "Overlay off, readings paused" : "Overlay: " + st.split(" (")[0];
  op.title = st;
  $("libCount").textContent = d.library && d.library.problem ? d.library.problem : "";
  const u = d.update || {}, up = $("updPill");
  up.hidden = !u.available;
  if (u.available) up.textContent = u.state === "idle" || u.state === "failed" ? `Version ${u.latest} is out` : "Updating…";
  if (u.state === "starting installer") waitForRestart();
  const dot = $("setupDot"); dot.hidden = !!d.game_found; dot.title = d.game_found ? "" : "Game folder not found";
  const g = d.groups || {}, nInt = (g.interest || []).length;
  $("grpCount").textContent = g.offer ? "!" : nInt ? nInt : "";
}
$("markBtn").onclick = () => openMoment();
// Lines for global chat: the best one up front, then "Found this on Verse Shards: verseshards.com" as its own row, the rest folded.
let FTS = true;
try { FTS = localStorage.getItem("fts") !== "0"; } catch (e) {}
// Folds that stay open when the Now tab redraws every few seconds
const keepOpen = new Set();
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.keep; if (k) { if (e.target.open) keepOpen.add(k); else keepOpen.delete(k); } }, true);
const kept = k => `data-keep="${k}" ${keepOpen.has(k) ? "open" : ""}`;
function chatBox(lines, title = "Copy for global chat", key = "chat") {
  if (!lines || !lines.length) return "";
  const row = l => `<div class="chatline"><span>${esc(l)}</span><button class="btn sm ghost" type="button" data-protected="true" data-chat="${esc(l)}">Copy</button></div>`;
  const more = lines.length - 1;
  return `<div class="frame chatbox"><div class="rhd"><h4>${esc(title)}</h4><span class="sub">Paste the first line, then the second so people know where it came from.</span></div>
    ${row(lines[0])}<div class="chatline src"><span>Found this on Verse Shards: verseshards.com</span><button class="btn sm ghost" type="button" data-protected="true" data-chat="Found this on Verse Shards: verseshards.com">Copy</button></div>${more ? `<details class="ex" ${kept(key)}><summary>${more} more line${more > 1 ? "s" : ""}</summary><div class="chatmore">${lines.slice(1).map(row).join("")}</div></details>` : ""}</div>`;
}
function chatText(line) { return line; } // the source line is its own row now, so nothing is appended
document.addEventListener("change", e => {
  if (!e.target.matches("[data-fts]")) return;
  FTS = e.target.checked;
  try { localStorage.setItem("fts", FTS ? "1" : "0"); } catch (x) {}
  document.querySelectorAll("[data-fts]").forEach(x => x.checked = FTS);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-chat]"); if (!b) return;
  const plain = b.hasAttribute("data-plain"), t = plain ? b.dataset.chat : chatText(b.dataset.chat);
  try { await navigator.clipboard.writeText(t); } catch (x) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  flashCopied(b);
  toast(plain ? `✓ Copied ${t}. Send them a party invite in game.` : "✓ Copied. In game press Enter, then Ctrl+V.");
});

/* ---------- updates ---------- */
// The installed app updates itself in one click; a copy unzipped by hand is sent to the download page
function updNotice(u) {
  if (!u || !u.available) return "";
  const busy = {downloading: `Downloading version ${esc(u.latest)}… ${Math.round((u.progress || 0) * 100)}%`,
    verifying: "Checking the download…", "starting installer": "Installing. The app closes and starts again by itself; this page reloads when it's back."}[u.state];
  if (busy) return `<div class="notice"><div class="nt"><b>${busy}</b>${u.state === "downloading" ? `<div class="upbar"><i style="width:${Math.round((u.progress || 0) * 100)}%"></i></div>` : ""}</div></div>`;

}

/* ---------- charts ---------- */
function lineChart(el, pts, key, color, unit, label) {
  const data = pts.filter(p => p[key] !== null && p[key] !== undefined);
  if (data.length < 2) { el.innerHTML = `<div class="nochart">Not enough readings yet</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 144, L = 34, R = 8, T = 8, B = 20;
  const xs = data.map(p => p.ts), ys = data.map(p => p[key]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y1 = Math.max(...ys) * 1.15 || 1; const y0 = 0;
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p) * p; };
  y1 = nice(y1);
  const X = t => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const ticks = [0, y1 / 2, y1];
  let path = data.map((p, i) => (i ? "L" : "M") + X(p.ts).toFixed(1) + " " + Y(p[key]).toFixed(1)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} over the last hour">
    <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t => `<text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
      <text x="${L}" y="${H - 4}">${tm(x0)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${tm(x1)}</text></g>
    <path class="ln" d="${path}" stroke="${color}"/>
    <line class="xh" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="dot" r="4.5" fill="${color}" visibility="hidden"/>
    <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot"), tip = el.querySelector(".tip");
  const move = e => {
    const r = svg.getBoundingClientRect(); const mx = (e.clientX - r.left) * W / r.width;
    let best = data[0]; for (const p of data) if (Math.abs(X(p.ts) - mx) < Math.abs(X(best.ts) - mx)) best = p;
    const px = X(best.ts), py = Y(best[key]);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = (px * r.width / W) + "px"; tip.style.top = (py * r.height / H) + "px";
    tip.innerHTML = `<b>${tm(best.ts)}</b>${fmt(best[key], key.includes("fps") ? 1 : 0)} ${esc(unit)}`;
  };
  svg.querySelector(".hit").addEventListener("pointermove", move);
  svg.querySelector(".hit").addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
}

function barChart(el, rows, key, color, unit) {
  if (!rows.length) { el.innerHTML = `<div class="nochart">No readings yet</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 144, L = 34, R = 8, T = 8, B = 20;
  const max = Math.max(...rows.map(r => r[key])) * 1.15 || 1;
  const bw = (W - L - R) / 24;
  const Y = v => T + (H - T - B) * (1 - v / max);
  const first = !el.dataset.drawn; el.dataset.drawn = "1";
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Server fps by hour of day"${first ? ' class="draw"' : ""}>
    <g class="grid"><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/></g>
    <g class="axis">${[0, 6, 12, 18].map(h => `<text x="${L + bw * h + bw / 2}" y="${H - 4}" text-anchor="middle">${String(h).padStart(2, "0")}:00</text>`).join("")}
      <text x="${L - 6}" y="${Y(max / 1.15) + 4}" text-anchor="end">${Math.round(max / 1.15)}</text></g>
    ${rows.map(r => { const x = L + bw * r.hour + 1, y = Y(r[key]), h = Y(0) - y;
      return `<path style="--i:${r.hour}" d="M${x} ${Y(0)} V${y + 4} q0 -4 4 -4 H${x + bw - 6} q4 0 4 4 V${Y(0)} Z" fill="${color}"/>
        <rect class="hit" x="${L + bw * r.hour}" y="${T}" width="${bw}" height="${H - T - B}" data-h="${r.hour}"/>`; }).join("")}
  </svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("pointerenter", () => { const r = rows.find(x => x.hour == h.dataset.h), sr = svg.getBoundingClientRect();
      tip.hidden = false; tip.style.left = ((L + bw * r.hour + bw / 2) * sr.width / W) + "px"; tip.style.top = (Y(r[key]) * sr.height / H) + "px";
      tip.innerHTML = `<b>${String(r.hour).padStart(2, "0")}:00 to ${String(r.hour + 1).padStart(2, "0")}:00</b>${fmt(r[key], 1)} ${unit} · ${r.readings} readings`; });
    h.addEventListener("pointerleave", () => tip.hidden = true);
  });
}

/* ---------- Now ---------- */
function cls(v, good, warn) { if (v === null || v === undefined) return ""; return v >= good ? "good" : v >= warn ? "warn" : "rust"; }
function clsLow(v, good, warn) { if (v === null || v === undefined) return ""; return v <= good ? "good" : v <= warn ? "warn" : "rust"; }

// Traffic lights, same as the site: high = Critical (red), medium = Major (amber), low = Minor (green); info is neutral
const SEV_WORD = {high: "Critical", medium: "Major", low: "Minor"};

const sevRank = (sev, kind) => kind === "info" ? 3 : ({high: 0, medium: 1, low: 2}[sev] ?? 2);

// ---- November round (Claude Design, v4) ----
// Pirate reports in the area you're in, as one line each: sightings keep the rust beacon, patrolling talk is amber and
// dashed with a slow radar sweep. Reports you filed for somewhere else on this shard show too. If nothing's near you
// but some are elsewhere on your shard, a quieter line.
const pirStrip = (x, where) => {
  const patrol = x.kind === "patrol", two = x.reporters >= 2;
  const what = patrol ? (two ? `${x.reporters} players say someone's patrolling` : "1 player says someone's patrolling") : (two ? `${x.reporters} pirate reports` : "1 pirate report");
  return `<div class="pirate${patrol ? " patrol" : ""}"><i class="edge" aria-hidden="true"></i><b class="plab">${patrol ? `<i class="radar" aria-hidden="true"></i>Patrolling` : "Pirates"}</b><span class="ptxt">${what} ${where} in the last 45 min</span><span class="pclr">clears in ${minsLeft(x.expires)}</span></div>`;
};
function pirHere(d) {
  const p = d.pirates_here; if (!p) return "";
  const out = [];
  if (p.here) out.push(pirStrip(p.here, `near ${esc(p.here.area_name)}`));
  (p.yours || []).forEach(r => out.push(pirStrip(r, `near ${esc(r.area_name)} (you reported it)`)));
  if (!out.length && p.elsewhere) return `<p class="pquiet">Nothing reported near ${esc(p.area_name || "you")}. ${p.elsewhere.reporters >= 2 ? `${p.elsewhere.reporters} reports` : "1 report"} near ${esc(p.elsewhere.area_name)} on this shard.</p>`;
  return out.join("");
}

    if (tab === "now") renderNow(); else if (tab === "groups") renderGroups();

// ---- Mark this moment, start to finish: screenshots, what went wrong, your moment ----
const clockM = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const clockS = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
async function openMoment(markTs, note) {
  // A fresh moment is marked first, so the app has the log and your readings for that second; an earlier one
  // (from the hotkey, or the list under What's gone wrong?) opens straight on its screenshots
  const fresh = !markTs;
  let t = markTs;
  if (fresh) { try { t = (await api("/api/mark", {})).mark.ts; } catch (e) { return toast(e.message, true); } }
  const S = {step: fresh ? 1 : 2, took: fresh ? null : true, shots: null, picked: new Set(), what: note || "", m: null, sent: null, drafted: null};
  // What you type is saved with the mark as you type it, so closing the window doesn't lose it (it stays on this PC)
  let noteTimer = null;
  const saveNote = () => { clearTimeout(noteTimer); noteTimer = setTimeout(() => api("/api/mark/note", {ts: t, what: S.what}).then(r => { const ms = nowData && nowData.marks; if (ms && r && r.mark) { const i = ms.findIndex(m => m.ts === r.mark.ts); if (i >= 0) ms[i] = r.mark; } }).catch(() => {}), 600); };
  const steps = () => `<div class="nv-steps">${["Screenshots", "What went wrong", "Your moment"].map((x, i) => `<span class="${S.step === i + 1 ? "on" : S.step > i + 1 ? "done" : ""}"><b>${S.step > i + 1 ? "✓" : i + 1}</b>${x}</span>`).join("")}</div>`;
  const fpsC = v => v == null ? "" : v < 9 ? "bad" : v < 15 ? "poor" : "";
  const shotSrc = n => `/api/shot?name=${encodeURIComponent(n)}&t=${encodeURIComponent(TOKEN)}`;
  const ago = ts => { const m = Math.max(1, Math.round(Math.abs((fresh ? Date.now() / 1000 : t) - ts) / 60)); return fresh ? `${m} min before` : `${m} min ${ts < t ? "before" : "after"}`; };
  const loadShots = async () => { try { const r = await api(`/api/moment?part=shots&ts=${t}`); S.shots = r.shots || []; S.asks = r.asks || []; } catch (e) { S.shots = []; toast(e.message, true); } };
  const loadMoment = async () => { try { S.m = await api(`/api/moment?ts=${t}`); } catch (e) { S.m = {error: e.message}; } };
  const view = () => {
    if (S.step === 1) return `${steps()}
      <div class="nv-mark"><span class="pin" aria-hidden="true">!</span><b>Marked at ${clockS(t)}</b><span>The app has the log and your readings for this second. Keep playing if you need to.</span></div>

        ${S.shots === null ? `<p class="nv-note">Looking in the game's screenshot folder…</p>` : S.shots.length ? `<div class="nv-shots">${S.shots.map((s, i) => `<button type="button" class="nv-shot" data-shot="${i}" aria-pressed="${S.picked.has(i)}"><img src="${shotSrc(s.name)}" alt="" loading="lazy"><i aria-hidden="true">${S.picked.has(i) ? "✓" : ""}</i><span>${clockM(s.ts)} · ${ago(s.ts)}</span></button>`).join("")}</div>`
          : `<p class="nv-note">No screenshots ${fresh ? "from the last 10 minutes" : "around this moment"} in the game's screenshot folder. <button class="link" type="button" id="nvLook">Look again</button></p>`}
        <p class="nv-note" style="margin-top:6px">Screenshots stay on this PC. They only go in the Issue Council report folder if you write one.</p></div>` : ""}

// A better shard in your region, worth a hop. A score from one player is a first look; don't suggest hopping on it.
// What else the overlay says about you (app.you_state): your ship, the planet, the mission you're tracking, and
// whether your PC's frame time goes on the CPU or the GPU. Only on this PC; none of it is shared.
function youLine(y) {
  if (!y) return "";
  const bits = [];
  if (y.ship) bits.push(`In your <b>${esc(y.ship)}</b>`);
  else if (y.in_room) bits.push("On foot");
  if (y.planet) bits.push(`on <b>${esc(y.planet)}</b>`);
  if (y.mission) bits.push(`tracking <b>${esc(y.mission)}</b>`);
  const pc = y.pc ? `Your PC: ${y.pc.bound === "gpu" ? "graphics card is the limit" : y.pc.bound === "cpu" ? "CPU is the limit" : "CPU and graphics card even"} (CPU ${fmt(y.pc.mt, 1)} ms, GPU ${fmt(y.pc.gpu, 1)} ms a frame)` : "";
  const line = [bits.join(", "), pc].filter(Boolean).join(" · ");
  return line ? `<div class="youline">${line}</div>` : "";
}

function hopTo(d) {
  const c = d.community, best = c && c.best, mine = c && c.mine;
  return best && mine && best.shard_id !== mine.shard_id && best.score - mine.score >= 20 && best.reporters >= 2 ? best : null;
}
// "Why: server restart · 4.0 fps · ping 265 ms": the short version of the advice, which opens on click
function whyLabel(h, pts) {
  const bits = [];
  if (h.restarts) bits.push(h.restarts > 1 ? `${h.restarts} server restarts` : "server restart");
  if (h.server_fps != null && h.server_fps < 12) bits.push(`${fmt(h.server_fps, 1)} fps`);
  if (h.ping_ms != null && h.ping_ms > 200) bits.push(`ping ${fmt(h.ping_ms)} ms`);
  if (h.loss_pct != null && h.loss_pct >= 2) bits.push(`${h.loss_pct}% packet loss`);
  if (h.hitches != null && h.hitches > 3) bits.push(`${h.hitches} hitches`);
  return bits.length ? bits.join(" · ") : `${pts.length} thing${pts.length > 1 ? "s" : ""} to know`;
}

// Other shards in your region, from the community board
function commSection(d) {
  const c = d.community;
  if (!c) return `<section class="sec"><div class="notice teal"><p><b>Compare your shard with the rest of your region.</b> Turn on the community board to see which shard is running best right now, from players' own readings.</p><button class="btn sm ghost" id="goSetup4">Turn it on</button></div></section>`;
  const mine = c.mine;
  const dot = x => `<span class="score ${x.cls}"><i></i>${x.score}</span>`;
  const rows = c.shards.map(x => `<tr class="${x.shard_id === (mine && mine.shard_id) ? "me" : ""}"><td>${dot(x)}</td><td title="${esc(x.shard_id)}"><b>${esc(x.name || x.shard_id)}</b>${x.shard_id === (mine && mine.shard_id) ? ` <span class="chip area">you</span>` : ""}${(x.servers || []).length ? `<span class="sub" style="display:block">${esc([...new Set(x.servers.flatMap(v => v.areas.map(a => a.name)))].slice(0, 4).join(", "))}</span>` : ""}</td>
    <td class="num">${fmt(x.server_fps, 1)}</td><td class="num">${fmt(x.pop_shard)}</td><td class="num">${x.reporters}${x.reporters < 2 ? ` <span class="sub" title="One player's readings: a first look, not a verdict">first look</span>` : ""}</td></tr>`).join("");
  return `<section class="sec"><h3>Your region right now <span>${esc(c.region || "")} on the community board${c.updated ? ", updated " + ago(c.updated) : ""}</span></h3>
    ${c.shards.length ? `<div class="frame" style="overflow-x:auto"><table class="comm"><thead><tr><th>Health</th><th>Shard</th><th class="num">Server fps</th><th class="num">Players</th><th class="num">Reporting</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="sub">${c.error ? esc(c.error) : "Nobody in your region is sharing readings right now."}</p>`}
    ${c.areas && c.areas.quiet && c.areas.quiet.length ? `<p class="sub" style="margin-top:var(--s3)"><b>Quieter areas right now:</b> ${c.areas.quiet.map(q => `${esc(q.area_name)} on ${esc(q.shard)} (${fmt(q.players)} players, ${fmt(q.server_fps, 1)} fps)`).join(" · ")}. Quieter means fewer players on that server, not safer.</p>` : ""}
    <p class="sub"><a href="${esc(COMMUNITY_SITE)}" target="_blank" rel="noopener">Open the full board</a> · <a href="${esc(COMMUNITY_SITE)}/trends" target="_blank" rel="noopener">Busiest times and patch report card</a></p></section>`;
}

/* ---------- What's gone wrong ---------- */
async function renderCheck() {
  if (!lastCheck) { try { const r = await api("/api/last"); if (r && r.findings) lastCheck = r; } catch (e) {} }
  const mins = (() => { try { return sessionStorage.getItem("mins") || "30"; } catch (e) { return "30"; } })();
  $("view").innerHTML = `
  <section class="checkbar frame">
    <button class="btn big" data-protected="true" id="runCheck">What's gone wrong?</button>
    <label class="sub">Look back <select id="mins">${[10, 30, 60, 120, 240].map(m => `<option value="${m}" ${m == mins ? "selected" : ""}>${m < 60 ? m + " minutes" : m / 60 + " hour" + (m > 60 ? "s" : "")}</option>`).join("")}</select></label>
    <p>Reads Game.log and the overlay readings for that period, matches them against the known-issues library and explains what it finds.</p>
    <div class="marks" id="marks"></div>
  </section>
  <div id="checkOut">${lastCheck ? "" : `<div class="empty"><h3>Nothing checked yet</h3><p>Something just went wrong in game? Press the button. You don't need to quit the game first.</p></div>`}</div>
  <div id="myReviews"></div>`;
  drawMyReviews();
  const marks = (nowData && nowData.marks) || (await api("/api/now").catch(() => ({marks: []}))).marks || [];
  $("marks").innerHTML = marks.length ? `<span class="sub">Moments you marked:</span>${marks.slice().reverse().slice(0, 6).map(m => `<button class="btn sm ghost" data-protected="true" data-mark="${m.ts}"${m.what ? ` title="${esc(m.what)}"` : ""}>Your moment, ${tm(m.ts)}${m.what ? `: ${esc(m.what.length > 28 ? m.what.slice(0, 27) + "…" : m.what)}` : ""}</button>`).join("")}`
    : `<span class="sub">Tip: press <b>Mark this moment</b> at the top${nowData && nowData.hotkey && nowData.hotkey.startsWith("on") ? ` (or ${esc(nowData.hotkey.slice(4))})` : ""} the moment something goes wrong, then check it here later.</span>`;
  $("marks").querySelectorAll("[data-mark]").forEach(b => b.onclick = () => openMoment(+b.dataset.mark, (marks.find(m => m.ts === +b.dataset.mark) || {}).what));
  $("mins").onchange = e => { try { sessionStorage.setItem("mins", e.target.value); } catch (x) {} };
  $("runCheck").onclick = () => runCheck();
  if (autoCheck) { autoCheck = false; runCheck(); }
  if (lastCheck) drawCheck(lastCheck);
}

async function runCheck(mark) {
  const b = $("runCheck"); b.disabled = true; b.textContent = "Checking…";
  try { lastCheck = await api("/api/diagnose", {minutes: +$("mins").value, mark: typeof mark === "number" ? mark : null}); drawCheck(lastCheck); }
  catch (e) { toast(e.message, true); }
  b.disabled = false; b.textContent = "What's gone wrong?";
}

// The new-build notice: CIG's listed fixes for this patch that this player hit in the fortnight before it
function patchFixes(p) {
  const all = (p && p.fixes) || [];
  if (!all.length) return "";
  const mine = all.filter(f => f.you), ask = all.filter(f => f.ask);
  const line = f => `<li>${esc(f.titles && f.titles.length ? generic(f.titles[0]) : f.said)}${f.starc ? ` <span class="sub">${esc(f.starc)}</span>` : ""}</li>`;
  const card = `<a href="${esc(COMMUNITY_SITE)}/trends#patch" target="_blank" rel="noopener">the patch card</a>`;
  let h = mine.length
    ? `<p><b>CIG's ${esc(all[0].patch)} notes list potential fixes for ${mine.length === 1 ? "a problem" : mine.length + " problems"} you hit in the last fortnight:</b></p><ul>${mine.map(line).join("")}</ul><p class="sub">If any of them turns up again, the check says so and its Issue Council draft mentions the listed fix. ${card} shows whether other players still hit them.</p>`
    : all.some(f => f.you === null) ? `<p class="sub">Checking your recent logs against CIG's ${esc(all[0].patch)} patch notes…</p>` : `<p class="sub">CIG's ${esc(all[0].patch)} notes list ${all.length} fixes Verse Shards can check. ${card} shows whether players still hit them.</p>`;
  if (ask.length) h += `<p class="sub">CIG asked players to report where these still happen: ${ask.map(f => esc(f.said)).join("; ")}. Mark the moment when you see one.</p>`;
  return h;
}

// What CIG's patch notes say about this problem (library cig_fixes): a fix on the way, or one listed that hasn't held
function fixNote(c) {
  if (!c) return "";
  const what = c.how === "same" ? "this" : "something related";
  const ref = c.starc ? ` (${esc(c.starc)})` : "";
  if (c.state === "coming") return `<p class="sub cfix"><b>Fix on the way.</b> CIG's ${esc(c.patch)} patch notes list a potential fix for ${what}: ${esc(c.said)}${ref}.</p>`;
  return `<p class="sub cfix warn"><b>Still happening after a listed fix.</b> CIG's ${esc(c.patch)} patch notes listed a potential fix for ${what}${ref}, and it turned up again. An Issue Council report saying so helps; the draft mentions it.</p>`;
}

function findCard(f, i, group) {
  const when = f.first_ts ? (f.first_ts === f.last_ts || !f.last_ts ? tm(f.first_ts) : `${tm(f.first_ts)} to ${tm(f.last_ts)}`) : "";
  return `<article class="find frame ${group === "unknown" ? "" : esc(f.severity)}${f.near_mark ? " near" : ""}">
    <div class="fh"><h4>${esc(f.title)}</h4>
      <span class="chip ${group === "unknown" ? "unknown" : esc(f.severity)}">${group === "unknown" ? "unrecognised" : esc(f.severity)}</span>
      ${f.area && group !== "unknown" ? `<span class="chip area">${esc(f.area)}</span>` : ""}
      ${f.near_mark ? `<span class="chip area">near your mark</span>` : ""}<span class="sub">${f.count > 1 ? f.count + " times, " : ""}${when}</span></div>
    ${group === "unknown" ? `<p class="sub">Not in the known-issues library yet. It may well be harmless; the game logs plenty of errors in a normal session.</p>` : `<p>${esc(f.explain)}</p>`}
    ${f.fixes && f.fixes.length ? `<ul>${f.fixes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${fixNote(f.cig_fix)}
    ${f.links && f.links.length ? `<p class="sub">${f.links.map(l => `<a href="${esc(l.url || l)}" target="_blank" rel="noopener">${esc(l.title || l.url || l)}</a>`).join(" · ")}</p>` : ""}
    ${f.examples && f.examples.length ? `<details class="ex"><summary>Log lines (${f.examples.length})</summary><pre class="lines">${esc(f.examples.join("\n"))}</pre></details>` : ""}
    <div class="fa">
      ${group === "unknown" ? `<button class="btn sm ghost" data-protected="true" data-review="${i}">Prepare for review</button>` : ""}
      <button class="btn sm ghost" data-protected="true" data-report="${i}" data-group="${group}">Issue Council draft</button>
      ${f.rule_id && group !== "unknown" ? `<button class="btn sm ghost" data-protected="true" data-had="${esc(f.rule_id)}" title="Adds one to the count on the community board's page for this issue">I had this: count me</button>
        <a class="btn sm ghost" href="${esc(COMMUNITY_SITE)}/issues/${esc(f.rule_id)}" target="_blank" rel="noopener">Workarounds and Issue Council links</a>` : ""}
    </div></article>`;
}

function drawCheck(r) {
  const out = $("checkOut"); if (!out) return;
  const hi = r.findings.filter(f => f.severity === "high").length;
  $("findCount").textContent = hi || "";
  out.innerHTML = `

async function copyText(t, what) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  flashCopied(document.activeElement);
  toast(`${what} copied. Paste it into the matching box on the Issue Council.`);
}
const grow = el => { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; };

function reportText() {
  const out = [];
  $("dBody").querySelectorAll("#icMain [data-sec]").forEach(sec => {
    const label = sec.dataset.label.toUpperCase();
    if (sec.dataset.sec === "steps") {
      const steps = [...sec.querySelectorAll("input.step")].map(x => x.value.trim()).filter(Boolean);
      out.push(label + "\n" + steps.map((x, n) => `${n + 1}. ${x}`).join("\n"));
    } else out.push(label + "\n" + secValue(sec));
  });
  return out.join("\n\n") + "\n";
}
const secValue = sec => { const f = sec.querySelector("textarea, select, input.one"); return f ? f.value.trim() : ""; };
// Characters used against the Issue Council's limit for that box
function counter(el, limit) {
  const c = el.closest("[data-sec]").querySelector(".cnt"); if (!c || !limit) return;
  const n = el.value.trim().length; c.textContent = `${n} / ${limit}`; c.classList.toggle("over", n > limit);
}

function stepRow(text, n, limit = 150) {
  return `<div class="steprow"><span class="sn">${n}</span><input class="inp step" value="${esc(text)}" maxlength="${limit}" aria-label="Step ${n}">
    <button class="btn sm ghost" data-protected="true" data-copystep title="Copy step ${n}">Copy</button><button class="iconx" data-protected="true" data-delstep aria-label="Remove step ${n}">✕</button></div>`;
}

function secHtml(sec) {
  const lim = sec.limit ? `<span class="cnt">${sec.text.length} / ${sec.limit}</span>` : "";
  const note = sec.note ? `<p class="note">${esc(sec.note)}</p>` : "";
  if (sec.key === "steps") return `<section class="rsec" data-sec="steps" data-label="${esc(sec.label)}" data-max="${sec.max}"><div class="rhd"><h4>${esc(sec.label)}</h4>
      <button class="btn sm" data-protected="true" data-copyall>Copy all steps</button></div>
      <p class="note">One step per box, up to ${sec.max} steps of ${sec.limit} characters. The first ones say where you were and how the server was doing, from Verse Shards.</p>
      <div class="steps-ed">${sec.steps.map((x, n) => stepRow(x, n + 1, sec.limit)).join("")}</div>
      <button class="link" data-protected="true" data-addstep>Add a step</button></section>`;
  if (sec.options) return `<section class="rsec" data-sec="${esc(sec.key)}" data-label="${esc(sec.label)}"><div class="rhd"><h4>${esc(sec.label)}</h4></div>
      <select class="inp" aria-label="${esc(sec.label)}">${sec.options.map(o => `<option ${o === sec.text ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${note}</section>`;
  const one = ["title", "version", "category", "c_version"].includes(sec.key);
  return `<section class="rsec" data-sec="${esc(sec.key)}" data-label="${esc(sec.label)}" data-limit="${sec.limit || ""}"><div class="rhd"><h4>${esc(sec.label)}</h4>
      <span class="grow"></span>${lim}<button class="btn sm" data-protected="true" data-copy>Copy</button></div>
      <textarea class="rta${one ? " one" : ""}"${one ? ' rows="1"' : ""} spellcheck="true" aria-label="${esc(sec.label)}"${sec.base !== undefined ? ` data-base="${esc(sec.base)}"` : ""}>${esc(sec.text)}</textarea>${note}</section>`;
}

const CREDIT = "Compiled from my Game.log by SC Shard Status (Verse Shards); checked and sent by me.";
function fitText(t, n) { t = t.replace(/[ \t]+/g, " ").trim(); if (t.length <= n) return t; return t.slice(0, n - 1).replace(/\s+\S*$/, "").replace(/[,;:]$/, "") + "…"; }

async function openReport(group, i) {

      <div id="icContrib">${c.sections.map(secHtml).join("")}</div></div>
      <details class="ex"><summary>Or write a new report anyway</summary><div id="icMain">${d.sections.map(secHtml).join("")}</div></details>` : `<div id="icMain">${d.sections.map(secHtml).join("")}</div>`;

    ${contrib}
    ${(() => { const sh = nowData ? sharing(nowData) : null; if (!sh) return ""; return sh.on
      ? `<div class="icshare on"><i></i><p><b>This counts on the board too.</b> Because you share readings, Verse Shards adds it to “players hit it today” on the issue's page, so the next player knows it's not just them.</p></div>`
      : `<div class="icshare"><i></i><p><b>Help the next player.</b> With sharing on, this issue counts on its Verse Shards page and on your shard's row, so others know it's not just them. Only the issue id and your shard are sent, never your handle.</p><button class="btn sm" type="button" id="icShare">See what's sent</button></div>`; })()}
    <p class="sub">This tool never sends anything to CIG. You submit the report yourself. What happened ends with a line saying this tool compiled it from your Game.log, so CIG knows where it came from. The report folder includes your own Game.log, which is fine: that's you reporting to them.</p>
    ${d.rule_id ? afterPostSection(d.linked || []) : ""}`);
  const body = $("dBody");
  if (d.rule_id) bindAfterPost(d.rule_id);
  if ($("icShare")) $("icShare").onclick = () => { closeDrawer(); show("setup"); setTimeout(() => { const x = $("commCard"); if (x) x.scrollIntoView({block: "start"}); }, 400); };
  body.querySelectorAll("textarea.rta").forEach(t => { grow(t); const lim = +t.closest("[data-sec]").dataset.limit || 0; t.addEventListener("input", () => { grow(t); counter(t, lim); }); counter(t, lim); });
  // "What were you doing?" starts "What happened?": edit one and the other follows, inside 520 characters
  const doing = body.querySelector('#icMain [data-sec="doing"] textarea'), hap = body.querySelector('#icMain [data-sec="happened"] textarea');
  if (doing && hap) doing.addEventListener("input", () => {
    const lim = +hap.closest("[data-sec]").dataset.limit || 520;
    hap.value = fitText([doing.value.trim(), hap.dataset.base || ""].filter(Boolean).join(" "), lim - CREDIT.length - 2) + "\n" + CREDIT;
    grow(hap); counter(hap, lim);
  });
  const renumber = sec => sec.querySelectorAll(".steprow").forEach((r, n) => { r.querySelector(".sn").textContent = n + 1; });
  body.addEventListener("click", e => {
    const t = e.target, sec = t.closest("[data-sec]");

    else if (t.matches("[data-delstep]")) { t.closest(".steprow").remove(); renumber(sec); }

      box.insertAdjacentHTML("beforeend", stepRow("", box.children.length + 1)); box.lastElementChild.querySelector("input").focus();

  $("icFolder").onclick = async () => { try { const r = await api("/api/bundle", {group, i, open: true, text: reportText()}); toast(`Report folder made with ${r.screenshots} screenshot${r.screenshots === 1 ? "" : "s"}: ${r.folder}`); } catch (e) { toast(e.message, true); } };
}

// What you did, in order, from Game.log: travel, places, ships, contracts and your connection
let tlFilter = new Set(), tlDetails = false;
async function renderTimeline() {
  let mins = 60; try { mins = +sessionStorage.getItem("tlmins") || 60; } catch (e) {}
  const d = await api("/api/timeline?minutes=" + mins);
  if (tab !== "timeline") return;
  const groups = d.groups || {};
  $("view").innerHTML = `
  <section class="sec"><div class="frame tlbar">
    <div class="seg" role="radiogroup" aria-label="How far back">${[[30, "30 min"], [60, "1 h"], [120, "2 h"], [240, "4 h"]].map(([m, l]) =>
      `<button type="button" data-mins="${m}" aria-pressed="${m === d.minutes}">${l}</button>`).join("")}</div>
    <div class="tlf" role="group" aria-label="Show">${Object.entries(groups).map(([k, l]) =>
      `<button type="button" data-g="${k}" aria-pressed="${!tlFilter.size || tlFilter.has(k)}">${esc(l)}</button>`).join("")}</div>
    <span class="grow"></span>
    <label class="sub"><input type="checkbox" id="tlDet" ${tlDetails ? "checked" : ""}> Details</label>
  </div></section>
  <section class="sec" id="tlOut"></section>`;
  const draw = () => {
    const rows = d.items.filter(i => !tlFilter.size || tlFilter.has(i.group)).slice().reverse();
    if (!rows.length) {
      $("tlOut").innerHTML = `<div class="empty"><h3>Nothing in this time</h3><p>${d.game_found ? "The timeline fills from Game.log as you play: places, quantum jumps, ships, contracts and your connection. Try a longer time." : "The game folder hasn't been found yet. Start Star Citizen and the app picks it up."}</p></div>`;
      return;
    }
    let lastDay = "", html = "";
    for (const i of rows) {
      const day = new Date(i.ts * 1000).toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"});
      if (day !== lastDay) { html += `<li class="day">${esc(day)}</li>`; lastDay = day; }
      const bad = ["disconnect", "crash", "contract_failed", "objective_failed", "contract_dropped"].includes(i.kind);
      html += `<li class="g-${esc(i.group)}${bad ? " bad" : ""}"><span class="t">${tm(i.ts)}</span><i class="k" title="${esc(groups[i.group] || "")}"></i>
        <span>${esc(i.text)}${tlDetails && i.code ? `<span class="x">${esc(i.code)}</span>` : ""}</span></li>`;
    }
    $("tlOut").innerHTML = `<ul class="frame tl">${html}</ul><p class="sub">Newest first. Read from your Game.log on this PC; nothing on this tab is shared.</p>`;
  };
  draw();
  $("view").querySelectorAll("[data-mins]").forEach(b => b.onclick = () => { try { sessionStorage.setItem("tlmins", b.dataset.mins); } catch (e) {} renderTimeline(); });
  $("view").querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const g = b.dataset.g, all = Object.keys(groups);
    if (!tlFilter.size) tlFilter = new Set(all);
    if (tlFilter.has(g)) tlFilter.delete(g); else tlFilter.add(g);
    if (tlFilter.size === all.length || !tlFilter.size) tlFilter = new Set();
    $("view").querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", !tlFilter.size || tlFilter.has(x.dataset.g)));
    draw();
  });
  $("tlDet").onchange = e => { tlDetails = e.target.checked; draw(); };
}

// Recruiting, looking for a group and pirate reports on Verse Shards. Nothing goes until you press a button.
// Composer choices survive a redraw
let gSuggested = null; let gKind = "recruit", gAct = null, gSpots = 2; let gDet = {voice: null, exp: null, style: null, seat: null, ship: "", lang: "", org: ""}, gHours = 2;
const ACT_ICON = a => (a || "Group").replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "GR";
const minsLeft = ts => { const m = Math.max(1, Math.round((ts - Date.now() / 1000) / 60)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// Your post drawn the way players see it on verseshards.com/groups
// Same card as verseshards.com/groups, so the poster sees exactly what others see.
// NEW fields (not built yet): p.details {voice, exp, ship, seat, lang, style, org}, p.filled, p.hours. Extend and Mark filled need API calls.
// details (NEW in v3): voice "voice" | "text", exp "new" | "regular" | "veteran", style "chill" | "focused", seat true or ship "<name>", lang, org
const DWORD = {voice: "Voice", text: "Text only", new: "New players welcome", regular: "Regular", veteran: "Veteran", chill: "Chill", focused: "Focused"};
function detailChips(d) {
  if (!d) return [];
  return [DWORD[d.voice] || "", d.exp ? (d.exp === "new" ? "New" : DWORD[d.exp]) : "", d.ship ? "Bringing a " + d.ship : d.seat ? "Need a seat" : "", d.lang || "", DWORD[d.style] || "", d.org ? "Org: " + d.org : ""].filter(Boolean);
}
function gcard(p) {
  const comm = nowData && nowData.community, live = comm && (comm.shards || []).find(x => x.shard_id === p.shard_id);
  const det = p.details; let filled = p.filled || 0;
  const spots = p.spots || 0, keen = Math.max(0, (p.keen || 0) - filled); filled = Math.min(spots, filled);
  // The time-left bar is sized to the post's own length (Playing for 1, 2 or 3 hours)
  const full = spots > 0 && filled >= spots, hours = p.hours || Math.max(1, Math.round((p.expires - (p.created || p.expires - 7200)) / 3600)), life = hours * 3600;
  const lf = Math.max(0, Math.min(1, (p.expires - Date.now() / 1000) / life)), ending = lf < .2;
  const chips = p.kind === "recruit" ? detailChips(det) : [];
  const pill = p.shard ? `<span class="hpill ${live ? live.cls : "none"}" title="${live ? "" : "Health shows when someone on this shard shares readings"}"><i></i><b>${esc(p.shard)}</b><span>${live ? live.score + " " + ({good: "healthy", ok: "OK", poor: "struggling", bad: "in a bad way"}[live.cls] || "") : "no readings yet"}</span></span>` : "";
  return `<article class="frame gcard${full ? " full" : ""}"><div class="gh"><span class="gicon" aria-hidden="true">${esc(ACT_ICON(p.activity))}</span>
      <div><div class="gt">${esc(p.activity || "Group")}${p.area_name ? ` near ${esc(p.area_name)}` : ""}</div><span class="sub">${p.kind === "lfg" ? "Looking for a group" : "Recruiting"}${p.created ? ` · posted ${ago(p.created)}` : ""}${p.handle ? ` by ${esc(p.handle)}` : ""}</span></div></div>
    <div class="gline">${pill}${p.server ? `<span class="sub">server ${esc(p.server)}</span>` : ""}</div>
    ${p.note ? `<p class="gnote">“${esc(p.note)}”</p>` : ""}
    ${chips.length ? `<div class="dchips">${chips.map(x => `<span class="dchip">${esc(x)}</span>`).join("")}</div>` : ""}
    <div class="gbottom">${p.kind === "recruit" && spots ? `<div class="gcrew"><span class="pips" aria-hidden="true">${(pop => Array.from({length: Math.min(spots, 12)}, (_, k) => `<i class="${k < filled ? "on" + pop(k) : k < filled + keen ? "keen" : ""}"></i>`).join(""))(pipsPop("card:" + p.id, filled))}</span><span>${filled} of ${spots} filled${keen && !full ? ` · ${keen} keen` : ""}</span></div>` : ""}
      <div class="gtime"><div class="tleft${ending ? " ending" : ""}" aria-hidden="true"><i style="width:${(lf * 100).toFixed(1)}%" data-drain="${p.expires}" data-life="${life}"></i></div><div class="sub"><span>Playing for ${plural(hours, "hour")}</span><span>${full ? "Crew full, closes itself" : (ending ? "Ends in " : "") + minsLeft(p.expires) + (ending ? "" : " left")}</span></div></div>

  const RING = (score) => { const r = 27, c = 2 * Math.PI * r, off = c * (1 - score / 100);

  const orderWord = n => n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : `${n}th`;
  // An app session card -> the shape the design's functions use

const gsUi = {};
let gsData = null, gsWait = null;
async function drawGameSettings() {
  const el = $("gsCard"); if (!el) return;
  try { gsData = await api("/api/gamesettings"); } catch (e) { el.innerHTML = `<section class="gs"><h3 class="vr-h">Your game settings</h3><span class="vr-sub">${esc(e.message)}</span></section>`; return; }
  if (!$("gsCard")) return;
  el.innerHTML = GS.settingsCard(gsData, gsUi);
  // While the game runs, Put them back waits; check again so it turns on by itself when the game closes
  clearTimeout(gsWait);
  if (gsData.game_running && (gsData.copies || []).some(c => c.state === "differs")) gsWait = setTimeout(() => { if (tab === "setup") drawGameSettings(); }, 10000);
  el.onclick = async e => {
    const t = e.target.closest("button"); if (!t || !el.contains(t)) return;
    const again = () => drawGameSettings();
    gsUi.err = null;
    if (t.matches("[data-save]")) {
      if (gsData.saved) { gsUi.confirm = "save"; gsUi.done = null; return again(); }
      try { const r = await api("/api/gamesettings/save", {}); Object.assign(gsUi, { confirm: null, done: `Saved. ${r.changed} changed settings and ${r.binds} custom key binds from ${r.from || "LIVE"}.` }); } catch (x) { gsUi.err = x.message; }
      return again();
    }
    if (t.dataset.diff) { gsUi.diff = gsUi.diff === t.dataset.diff ? null : t.dataset.diff; return again(); }
    if (t.dataset.put) { gsUi.confirm = "put:" + t.dataset.put; gsUi.done = null; return again(); }
    if (t.matches("[data-no]")) { gsUi.confirm = null; return again(); }
    if (t.dataset.yes === "save") {
      try { await api("/api/gamesettings/save", { replace: true }); Object.assign(gsUi, { confirm: null, done: "Saved again. The old save was replaced." }); } catch (x) { gsUi.err = x.message; }
      return again();
    }
    if (t.dataset.yes === "put") {
      const c = gsUi.confirm.slice(4);
      try { const r = await api("/api/gamesettings/restore", { copy: c }); Object.assign(gsUi, { confirm: null, diff: null, done: r.message }); } catch (x) { gsUi.err = x.message; }
      return again();
    }
  };
}
