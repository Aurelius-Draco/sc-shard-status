const bpState = { q: "", g: null, earned: [], want: [], seen: new Set() };
async function renderBlueprints() {
  const d = await api("/api/blueprints");
  if (tab !== "blueprints") return;
  VR.setGroups(d.groups);
  bpState.earned = d.earned.map(VR.fromApi); bpState.want = d.want;

}
function drawBlueprints(keep) {
  $("view").innerHTML = `<section class="sec vr"><div class="bp-tab" style="display:flex;flex-direction:column;gap:18px">${VR.blueprintsTab(bpState)}</div></section>`;
  bpState.earned.filter(b => b.fresh).forEach(b => bpState.seen.add(b.id));        // flash once, not on every redraw
  if (keep) { const i = $("view").querySelector("[data-bpq]"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  const v = $("view");
  v.querySelector("[data-bpq]") && (v.querySelector("[data-bpq]").oninput = e => { bpState.q = e.target.value; drawBlueprints(true); });
  const f = v.querySelector("[data-wantform]");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const name = f.w.value.trim(); if (!name) return;
    try { const r = await api("/api/blueprints/want", { name }); bpState.want = r.want; drawBlueprints(); }
    catch (x) { if (/already have/.test(x.message)) VR.vtoast(`${VR.MARK()}<span>You already have <b>${esc(name)}</b>.</span>`); else toast(x.message, true); }
  };
  v.onclick = async e => {
    const t = e.target.closest("button, a"); if (!t || !v.contains(t)) return;
    if (t.dataset.g !== undefined && t.closest(".bp-groups")) { bpState.g = t.dataset.g === "" ? null : +t.dataset.g; return drawBlueprints(); }
    if (t.matches("[data-bpclear]")) { bpState.q = ""; return drawBlueprints(); }
    if (t.matches("[data-unwant]")) { try { const r = await api("/api/blueprints/unwant", { name: t.dataset.unwant }); bpState.want = r.want; drawBlueprints(); } catch (x) { toast(x.message, true); } return; }
    if (t.dataset.bp !== undefined) { const b = bpState.earned.find(x => x.id === t.dataset.bp); if (b) VR.dlg(VR.blueprintDetail(b)); }
  };
}

let ssPage = 0, ssCache = null;

async function openSession(id) {
  let c;
  try { c = await api(`/api/session?id=${encodeURIComponent(id)}`); } catch (e) { toast(e.message, true); return; }
  const s = VR.fromCard(c), st = {};
  const d = VR.dlg(VR.sessionReport(s, st), true);
  let timerNote = null, timerAuec = null;
  const save = async body => { try { await api("/api/session/note", Object.assign({ id: s.id }, body)); } catch (x) { toast(x.message, true); } };
  d.addEventListener("click", async e => {
    const t = e.target.closest("button, a"); if (!t) return;
    if (t.matches("[data-close]")) return VR.closeDlg();
    if (t.dataset.rate) { const cur = st.rating !== undefined ? st.rating : s.rating; st.rating = cur === t.dataset.rate ? null : t.dataset.rate;
      t.closest(".ss-rating").querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rate === st.rating)));
      await save({ rating: st.rating }); drawSessions(); return; }
    if (t.matches("[data-go-bp]")) { e.preventDefault(); VR.closeDlg(); show("blueprints"); return; }
    if (t.dataset.explain) { e.preventDefault(); VR.closeDlg(); explainRule(t.dataset.explain); return; }
  });
  d.addEventListener("input", e => {
    const t = e.target;
    if (t.matches("[data-note]")) { st.note = t.value; clearTimeout(timerNote); timerNote = setTimeout(() => save({ note: st.note }), 600); }
    if (t.dataset.auec) { st.auec = st.auec || Object.assign({}, s.auec); st.auec[t.dataset.auec] = t.value;
      const box = t.closest(".ss-box"), a = st.auec, sv = +String(a.s || "").replace(/\D/g, ""), en = +String(a.e || "").replace(/\D/g, "");
      const out = box.querySelector(".ss-diff, .ss-box > .vr-sub:last-child");
      if (out) out.outerHTML = sv && en ? `<span class="ss-diff ${en - sv >= 0 ? "is-made" : "is-spent"}">${en - sv >= 0 ? "Made" : "Spent"} ${Math.abs(en - sv).toLocaleString("en-AU")} aUEC</span>`
        : `<span class="vr-sub">The game doesn't record money anywhere the app can read, so type it in if you want to track it.</span>`;
      clearTimeout(timerAuec); timerAuec = setTimeout(() => save({ auec_start: a.s || "", auec_end: a.e || "" }), 600); }
  });
}
// "What happened" in a session report: the library's own explanation, in the drawer the rest of the app uses

/* ---------- Known issues ---------- */
// Library text has blanks the app fills from the log line ({item_name}); in the list, show them as plain words
const COMMUNITY_SITE = "https://verseshards.com";
const BLANKS = {item_name: "an item", vehicle: "a ship", task: "a step", which: "", seconds: "N", metres: "N",
  pct: "N", commit_mb: "N", left_mb: "N", from: "one point", to: "another", manager: "", reason: "the reason given"};
function generic(t) {
  return String(t || "").replace(/\s*\(\{\w+\}\)/g, "").replace(/\{(\w+)\}/g, (m, k) => k in BLANKS ? BLANKS[k] : "…")
    .replace(/\s{2,}/g, " ").replace(/\s+([.,:])/g, "$1").trim();
}

async function renderIssues() {
  const d = await api("/api/issues");
  if (tab !== "issues") return;
  const areas = [...new Set(d.rules.map(r => r.area || "Other"))].sort();
  $("view").innerHTML = `
  <section class="sec"><h3>Known issues <span>library ${esc(d.version)}, ${d.rules.length} entries (harmless messages hidden)</span></h3>
    <p class="intro">What the app recognises in Game.log. Each entry is a log pattern with a plain-English explanation and fixes. The library is a data file, so new entries arrive without a new version of the app.</p>
    <div class="fa"><input class="inp" type="search" id="libQ" placeholder="Search, e.g. elevator, 30k, contract"></div>
    <div id="libList" class="lib"></div></section>`;
  const draw = () => {
    const q = $("libQ").value.toLowerCase();
    const rows = d.rules.filter(r => !q || (r.title + " " + r.explain + " " + r.area).toLowerCase().includes(q)).sort((a, b) => sevRank(a.severity, a.kind) - sevRank(b.severity, b.kind));
    $("libList").innerHTML = rows.length ? rows.map(r => `<details class="frame${r.kind !== "info" && r.severity === "high" ? " crit" : r.kind !== "info" && r.severity === "medium" ? " maj" : ""}"><summary><span class="t">${esc(generic(r.title))}</span>
      ${sevTag(r.severity, r.kind)}<span class="chip area">${esc(r.area)}</span></summary>
      <p>${esc(generic(r.explain))}</p>${r.fixes.length ? `<ul>${r.fixes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${r.links.length ? `<p class="sub">${r.links.map(l => `<a href="${esc(l.url || l)}" target="_blank" rel="noopener">${esc(l.title || l.url || l)}</a>`).join(" · ")}</p>` : ""}
      <p class="sub">Seen in builds: ${esc((r.builds_seen || []).join(", ") || "not yet seen in a player log")}</p></details>`).join("")
      : `<div class="empty"><h3>Nothing matches</h3></div>`;
  };
  $("libQ").oninput = draw; draw();
}

  <section class="sec frame setcard" id="sgTips">
    <h4>Tips for clean readings</h4>
    <ul class="rules">
      <li><b>Dark behind the text reads best.</b> The overlay is thin light text. Over the sun, a bright planet, snow, lights or a white wall it washes out and the reading is skipped. Face something dark (space, a ship interior, a dark wall or floor) when you want a reading.</li>
      <li><b>Quickest trick for screenshots:</b> press <kbd>Esc</kbd> first. The game menu darkens the whole screen behind the overlay, then press <kbd>Print Screen</kbd>. The game keeps running while the menu is open.</li>
      <li><b>Keep the top right corner clear.</b> Move other overlays (Discord, Steam, NVIDIA or AMD performance counters, RivaTuner) to another corner so they don't sit on top of the game's text.</li>
      <li><b>Turn off Chromatic Aberration and Film Grain</b> in the game's Graphics settings. Both blur small text.</li>
      <li><b>1440p or higher reads every value reliably.</b> At 1080p the text is tiny; the main numbers still read, but the odd small value can be misread. The app takes the middle value over a few minutes, so one bad reading doesn't change the score.</li>
      <li><b>Play on your main monitor,</b> or set <code>monitor</code> to the screen the game is on (2, 3 and so on) in <code>config.json</code> in the app's data folder: <code>%LOCALAPPDATA%\\SC Shard Status</code> for the installed app. <button class="btn sm ghost" data-protected="true" data-open="data">Open the data folder</button></li>

    $("alertSeg").querySelectorAll("[data-al]").forEach(b => b.onclick = async () => {

        <div class="fa" id="wzPathRow" hidden><input class="inp" id="wzPath" placeholder="e.g. D:\\Games\\Roberts Space Industries\\StarCitizen\\LIVE" style="flex:1 1 24rem"></div>`],

    ["screenshots", "This app", "Read the screenshots you take?",

    ["share", "Community board", "Share your readings with the community board?",

  const many = qs.length === 1 ? "1 new question" : `${qs.length} ${isNew ? "new " : ""}questions`;
  w.innerHTML = `<div class="box"><header><h2 id="wzTitle">${isNew ? `This version brings ${many}` : `Before you start: ${qs.length} quick questions`}</h2>
    <p>${isNew ? "Your earlier answers are kept. " : ""}Each one needs a yes or a no, so nothing gets missed. You can change any of them later on the Set up tab.</p></header>
    ${qs.map(([k, eb, h, p, a], i) => `<section class="wq" id="wq-${k}"><span class="qn">${i + 1} of ${qs.length} · ${eb}</span><h3>${h}</h3><p>${p}</p>${a}</section>`).join("")}
    <footer><span class="sub" id="wzLeft"></span><span class="grow"></span><button class="btn big" data-protected="true" id="wzDone" disabled>Save and start</button></footer></div>`;
  document.body.appendChild(w);
  document.body.style.overflow = "hidden";
  const update = () => {
    const pathOk = A.game !== "other" || ($("wzPath") && $("wzPath").value.trim().length > 2);
    const left = qs.filter(([k]) => A[k] === undefined || (k === "game" && !pathOk)).length;
    $("wzLeft").textContent = left ? `${left} still to answer` : "All answered.";
    $("wzDone").disabled = !!left;
    qs.forEach(([k]) => $("wq-" + k).classList.toggle("done", A[k] !== undefined && (k !== "game" || pathOk)));
  };
  w.querySelectorAll(".ans").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = g.dataset.q;
    A[k] = b.dataset.v === "1" ? true : b.dataset.v === "0" ? false : b.dataset.v;
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (k === "game") { $("wzPathRow").hidden = A.game !== "other"; if (A.game === "other") $("wzPath").focus(); }
    update();
  }));
  if ($("wzPath")) $("wzPath").oninput = update;
  $("wzDone").onclick = async () => {
    const choices = {...A, game: A.game === "other" ? $("wzPath").value.trim() : A.game};
    $("wzDone").disabled = true;
    try {
      const r = await api("/api/setup", {choices});
      toast(r.message); w.remove(); document.body.style.overflow = ""; show(tab);
    } catch (e) { toast(e.message, true); $("wzDone").disabled = false; }
  };
  update();
}

show(tab);
api("/api/now").then(d => { header(d); if (d.setup_needed) openWizard(); }).catch(() => {});
</script>
</body>
</html>
