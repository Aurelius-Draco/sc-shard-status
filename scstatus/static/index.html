  <section class="sec frame setcard" id="sgShots">
    <h4>3. Screenshots</h4>
    <p>Press <kbd>Print Screen</kbd> in game. The game saves them in <code>StarCitizen\\LIVE\\screenshots</code>. Any screenshot with the overlay on it becomes a reading, and the app picks up screenshots taken around the time of a problem when it makes an Issue Council report folder.</p>
  </section>
  <section class="sec frame setcard" id="sgTips">
    <h4>Tips for clean readings</h4>
    <ul class="rules">
      <li><b>Dark behind the text reads best.</b> The overlay is thin light text. Over the sun, a bright planet, snow, lights or a white wall it washes out and the reading is skipped. Face something dark (space, a ship interior, a dark wall or floor) when you want a reading.</li>
      <li><b>Quickest trick for screenshots:</b> press <kbd>Esc</kbd> first. The game menu darkens the whole screen behind the overlay, then press <kbd>Print Screen</kbd>. The game keeps running while the menu is open.</li>
      <li><b>Keep the top right corner clear.</b> Move other overlays (Discord, Steam, NVIDIA or AMD performance counters, RivaTuner) to another corner so they don't sit on top of the game's text.</li>
      <li><b>Turn off Chromatic Aberration and Film Grain</b> in the game's Graphics settings. Both blur small text.</li>
      <li><b>1440p or higher reads every value reliably.</b> At 1080p the text is tiny; the main numbers still read, but the odd small value can be misread. The app takes the middle value over a few minutes, so one bad reading doesn't change the score.</li>
      <li><b>Play on your main monitor,</b> or set <code>monitor</code> to the screen the game is on (2, 3 and so on) in <code>config.json</code> in the app's data folder: <code>%LOCALAPPDATA%\\SC Shard Status</code> for the installed app. <button class="btn sm ghost" data-protected="true" data-open="data">Open the data folder</button></li>
      <li>Live reading skips anything it can't read and tries again 5 seconds later, so a bright moment just means a gap, not a wrong number.</li>
    </ul>

    <p><b>Live</b> reads the overlay corner of your screen every 5 seconds while the game is in front. That gives the health score, the charts and warnings when the server slows down. <b>Screenshots</b> reads only the screenshots you take, so nothing watches your screen; you get a reading each time you press <kbd>Print Screen</kbd>, but no live score.</p>

  </section>
  <h2 class="sgroup">Sharing and the community board</h2><section class="sec frame setcard" id="commCard">
    <h4>Community board</h4>
    <p>The <a href="${esc(COMMUNITY_SITE)}" target="_blank" rel="noopener">community board</a> shows the health of every shard players are reporting from, so you can see which shard in your region is running best before you start something important. You answered these on first start; change them here any time.</p>
    <ul class="rules">
      <li><b>Show other shards</b> fetches the board every 2 minutes and puts your region on the Now tab. It sends nothing about you.</li>
      <li><b>Share my readings</b> sends one summary every 5 minutes while the overlay is being read: shard id, server node number, the area your server runs (a planet, jump point or open space, never the exact place), server fps, hitches, restarts, players on the shard and server, ping rounded to 10 ms, packet loss, known-issue ids, game build, a random install id, your screen size and counts of how cleanly the overlay was read. After each game session it also sends that session's build, length, load time, whether it crashed and any disconnect error codes with the game's wording for them (letters only), for the patch report card. Never your handle, other players' names, account or session numbers, file paths or screenshots.</li>
    </ul>
    <div class="swlist" id="commToggles"></div>
    <details class="ex"><summary>See exactly what was last sent</summary><pre class="lines" id="commPayload">Nothing sent yet.</pre></details>
  </section>
  <h2 class="sgroup">The app</h2><section class="sec frame setcard" id="markCard">
    <h4>Mark this moment</h4>
    <p>Something just went wrong? Press <b>Mark this moment</b> at the top of this page and keep playing. Later, "What's gone wrong?" looks at exactly that moment, and the Issue Council draft uses its time. A hotkey does the same without leaving the game. It's registered with Windows, which tells the app only when that one combination is pressed; the app never watches the keyboard.</p>
    <div class="fa"><div class="seg" id="hkSeg" role="radiogroup" aria-label="Hotkey"></div></div>
    <p class="sub" id="hkState"></p>
  </section>
  <section class="sec frame setcard" id="errCard">
    <h4>App error reports</h4>
    <p>When something in SC Shard Status itself goes wrong, send where and what, so it can be fixed. Every file path is cut down to the file name and anything in quotes is taken out. Never Game.log lines, your handle, your files or screenshots.</p>
    <div class="swlist" id="errToggles"></div>
    <details class="ex"><summary>See exactly what was last sent</summary><pre class="lines" id="errPayload">Nothing sent yet.</pre></details>
  </section>
  <section class="sec frame setcard" id="updCard">
    <h4>Updates</h4>
    <p>The app asks GitHub whether there's a newer version a minute after it starts and every 6 hours after that. It only asks; nothing is sent about you, and nothing installs until you click Update now. The installed app then updates itself and starts again, keeping your settings and history.</p>
    <div class="swlist" id="updToggles"></div>
    <div id="updState" style="display:grid;gap:var(--s2);margin-top:var(--s3)"></div>
  </section>
  <section class="sec frame setcard" id="alertCard">
    <h4>Pop-up alerts</h4>
    <p>A Windows notification when the server's fps falls off a cliff, the server restarts, packet loss climbs, you're disconnected, or a known problem turns up in Game.log. Each kind at most once every 10 minutes.</p>
    <p class="sub">Windows holds notifications back while a full-screen game is in front (Settings, System, Notifications, "Turn on do not disturb automatically when playing a game"). Borderless window mode or a second screen gets them through; the sound plays either way.</p>
    <div class="fa"><div class="seg" id="alertSeg" role="radiogroup" aria-label="Pop-up alerts"></div><button class="btn sm ghost" data-protected="true" id="alertTest">Send a test alert</button></div>
  </section>
  <section class="sec frame setcard" id="libCard">
    <h4>Known-issues library</h4>
    <p>The library is what "What's gone wrong?" checks Game.log against. New entries are added as players send errors for review and patches change things. With updates on, the app fetches the newest copy from the community site a minute and a half after it starts and every 6 hours. It's a plain download; nothing is sent about you.</p>
    <div class="swlist" id="libToggles"></div>
    <div id="libState" style="margin-top:var(--s3)"></div>
  </section>
  <section class="sec"><p class="sub">USER.cfg lives in your StarCitizen\\LIVE folder${u.path ? ` (<code>${esc(u.path)}</code>)` : ""}. Before each change the app saves the file as it was to USER.cfg.bak. Changes take effect the next time the game starts; type the command in the console to use it straight away.</p></section>`;
  $("gdSave").onclick = async () => {
    try { const r = await api("/api/gamedir", {path: $("gdPath").value}); toast(r.message); nowData = await api("/api/now"); renderSetup(); }
    catch (e) { toast(e.message, true); }
  };
  // Each setting is a row with clear On / Off buttons and a sentence saying what it's doing right now
  const swRow = (key, label, on, note) => `<div class="swrow"><div class="swl"><b>${label}</b><span class="sub">${note}</span></div>
    <div class="onoff" role="group" aria-label="${label}"><button type="button" data-protected="true" data-sw="${key}" data-v="1" aria-pressed="${!!on}">On</button><button type="button" data-protected="true" data-sw="${key}" data-v="0" aria-pressed="${!on}">Off</button></div></div>`;
  const bindRows = (el, redraw) => el.querySelectorAll("[data-sw]").forEach(b => b.onclick = async () => {
    try { const r = await api("/api/settings", {[b.dataset.sw]: b.dataset.v === "1"}); toast(r.message); redraw(); } catch (e) { toast(e.message, true); }
  });
  const drawToggles = async () => {
    const st = await api("/api/settings");
    $("setToggles").innerHTML =
      swRow("live", "Live screen reading", st.live, st.live ? "On. Reads the overlay every 5 seconds while the game is in front." : "Off. Nothing watches your screen.") +
      swRow("screenshots", "Read my screenshots", st.screenshots, st.screenshots ? `On. Screenshots with the overlay become readings${st.screenshot_readings ? ` (${st.screenshot_readings} this run)` : ""}.` : "Off. Screenshots are left alone.");
    bindRows($("setToggles"), drawToggles);
  };
  drawToggles();
  const shareNote = st => {
    if (!st.share) return "Off. Nothing is sent.";
    if (st.share_status === "sharing") return `On. ${st.sent} summar${st.sent === 1 ? "y" : "ies"} sent this run${st.sent_at ? ", the last at " + tm(st.sent_at) : ""}. Your shard is on the board.`;
    if (st.share_status === "waiting for overlay readings") return "On, waiting for overlay readings. In game, press ~ and type r_displayinfo 3. The first summary goes after 5 minutes of readings.";
    if (st.share_status === "starting" || st.share_status === "off") return "On. The first summary goes after 5 minutes of overlay readings.";
    return "On, but: " + esc(st.share_status);
  };
  const drawComm = async () => {
    if (!$("commToggles")) return;
    const st = await api("/api/settings");
    $("commToggles").innerHTML =
      swRow("board", "Show other shards", st.board, st.board ? (st.board_error ? "On, but: " + esc(st.board_error) : "On. Your region shows on the Now tab, updated every 2 minutes.") : "Off. The Now tab doesn't show other shards.") +
      swRow("share", "Share my readings", st.share, shareNote(st));
    $("commPayload").textContent = st.last_payload ? JSON.stringify(st.last_payload, null, 2) : "Nothing sent yet.";
    bindRows($("commToggles"), drawComm);
    clearTimeout(window.__commT); window.__commT = setTimeout(() => { if (tab === "setup") drawComm(); }, 15000);
  };
  drawComm();
  const drawUpd = async () => {
    if (!$("updToggles")) return;
    const st = await api("/api/settings"), u = st.update || {};
    $("updToggles").innerHTML = swRow("updates", "Check for new versions", st.updates,
      st.updates ? (u.checked_at ? `On. Last checked ${ago(u.checked_at)}.` : "On. First check a minute after the app starts.") : "Off. You'll need to look on the site for new versions.");
    bindRows($("updToggles"), drawUpd);
    $("updState").innerHTML = `<div class="fa"><span>You have version <b>${esc(u.current)}</b>${u.installed_app ? "" : " (unzipped copy)"}${u.available ? `. Version <b>${esc(u.latest)}</b> is out.` : u.latest ? ", the latest." : "."}</span>
      <button class="btn sm ghost" data-protected="true" data-upd="check">Check now</button></div>${u.error && u.state !== "failed" ? `<p class="sub">${esc(u.error)}</p>` : ""}${updNotice(u)}`;
  };
  drawUpd();
  const drawLib = async () => {
    if (!$("libToggles")) return;
    const st = await api("/api/settings"), L = st.library_sync || {};
    $("libToggles").innerHTML = swRow("library", "Keep the library up to date", st.library,
      st.library ? (L.checked_at ? `On. Last checked ${ago(L.checked_at)}.` : "On. First check a minute and a half after the app starts.") : "Off. Using the library that came with this version of the app.");
    bindRows($("libToggles"), drawLib);
    $("libState").innerHTML = `<div class="fa"><span>Library <b>${esc(L.version)}</b>${L.updated_at ? `, updated ${ago(L.updated_at)}` : ""}.</span><button class="btn sm ghost" data-protected="true" id="libCheck">Check now</button></div>
      ${L.error ? `<p class="sub">${esc(L.error)}</p>` : L.note ? `<p class="sub">${esc(L.note)}</p>` : ""}`;
    $("libCheck").onclick = async () => { $("libCheck").disabled = true; try { const r = await api("/api/library/check", {}); toast(r.error || r.note || "Already up to date."); } catch (e) { toast(e.message, true); } drawLib(); };
  };
  drawLib();
  const drawAlerts = async () => {
    if (!$("alertSeg")) return;
    const st = await api("/api/settings"), m = (st.alerts || {}).mode || "";
    $("alertSeg").innerHTML = [["sound", "On, with a sound"], ["quiet", "On, no sound"], ["", "Off"]]
      .map(([v, l]) => `<button type="button" data-protected="true" data-al="${v}" aria-pressed="${m === v}">${l}</button>`).join("");
    $("alertSeg").querySelectorAll("[data-al]").forEach(b => b.onclick = async () => {
      try { const r = await api("/api/settings", {alerts: b.dataset.al || false}); toast(r.message); drawAlerts(); } catch (e) { toast(e.message, true); }
    });
    $("alertTest").disabled = !m;
  };
  drawAlerts();
  const drawExtra = async () => {
    if (!$("hkSeg")) return;
    const st = await api("/api/settings");
    $("hkSeg").innerHTML = [["", "No hotkey"], ["ctrl+alt+m", "Ctrl+Alt+M"], ["ctrl+shift+m", "Ctrl+Shift+M"], ["ctrl+alt+f9", "Ctrl+Alt+F9"], ["ctrl+alt+f10", "Ctrl+Alt+F10"]]
      .map(([v, l]) => `<button type="button" data-protected="true" data-hk="${v}" aria-pressed="${(st.hotkey || "") === v}">${l}</button>`).join("");
    $("hkState").textContent = st.hotkey_status === "off" ? "Off. Use the button at the top of the page." : "Hotkey " + st.hotkey_status + ".";
    $("hkSeg").querySelectorAll("[data-hk]").forEach(b => b.onclick = async () => { try { const r = await api("/api/settings", {hotkey: b.dataset.hk}); toast(r.message); drawExtra(); } catch (e) { toast(e.message, true); } });
    $("errToggles").innerHTML = swRow("errors", "Send app error reports", st.errors, st.errors ? `On. ${st.errors_sent ? st.errors_sent + " sent this run." : "Nothing has gone wrong this run."}` : "Off. Nothing is sent.");
    bindRows($("errToggles"), drawExtra);
    $("errPayload").textContent = st.errors_payload ? JSON.stringify(st.errors_payload, null, 2) : "Nothing sent yet.";
  };
  drawExtra();
  $("alertTest").onclick = async () => { try { const r = await api("/api/alerts/test", {}); toast(r.message); } catch (e) { toast(e.message, true); } };
  $("redoWiz").onclick = () => openWizard(true);
  $("view").querySelectorAll("[data-cfg]").forEach(b => b.onclick = async () => {
    try { const r = await api("/api/usercfg", {name: b.dataset.cfg, on: b.dataset.on === "1"}); toast(r.message); nowData = null; nowData = await api("/api/now"); renderSetup(); }
    catch (e) { toast(e.message, true); }
  });
  $("view").querySelectorAll("[data-jump]").forEach(a => a.onclick = ev => { ev.preventDefault(); const t = $(a.dataset.jump); if (t) window.scrollTo({top: t.getBoundingClientRect().top + window.scrollY - 70, behavior: "smooth"}); });
}

      `The board only works if players share. One summary every 5 minutes while the overlay is read: shard id, server node number, the area your server runs (a planet, jump point or open space, never the exact place), server fps, hitches, restarts, players, ping rounded to 10 ms, packet loss, known-issue ids, game build, a random install id, your screen size and counts of how cleanly the overlay was read. After each game session: its build, length, load time, whether it crashed and any disconnect error codes with the game's wording for them (letters only). Never your handle, other players' names, account or session numbers, file paths or screenshots. You can see exactly what was sent on the Set up tab.`,
      yn("share", "Yes, share", "No, don't share") + now(st.share)],
    ["updates", "This app", "Tell you when there's a new version?",
      `A minute after it starts and every 6 hours after that, the app asks GitHub whether there's a newer version, and shows a button on the dashboard when there is. Nothing installs until you click it. ${st.update && st.update.installed_app ? "The installed app then updates itself and starts again." : "This copy was unzipped by hand, so it points you to the installer."}`,
      yn("updates", "Yes, tell me", "No, I'll check myself") + now(st.updates)],
    ["alerts", "This app", "Pop up an alert when something goes wrong while you play?",
      `A Windows notification when the server's fps falls off a cliff, the server restarts, packet loss climbs, you're disconnected, or a known problem turns up (like contract deliveries not counting). Each kind at most once every 10 minutes. Windows holds notifications back over full-screen games, so borderless window mode or a second screen works best; the sound plays either way.`,
      `<div class="ans" data-q="alerts"><button type="button" data-v="sound">Yes, with a sound</button><button type="button" data-v="quiet">Yes, no sound</button><button type="button" data-v="0">No</button></div>` +
      (st.alerts && st.alerts.mode ? `<span class="now">Right now: on${st.alerts.mode === "quiet" ? ", no sound" : ", with a sound"}</span>` : `<span class="now">Right now: off</span>`)],
    ["library", "This app", "Keep the known-issues library up to date?",
      `"What's gone wrong?" checks your Game.log against a library of known issues. New entries are added as players send errors for review and patches change things. Yes fetches the newest copy from the <a href="${esc(COMMUNITY_SITE)}" target="_blank" rel="noopener">community site</a> every 6 hours. It's a plain download; nothing is sent about you.`,
      yn("library", "Yes, keep it current", "No, use the one that came with the app") + now(st.library)],
    ["errors", "This app", "Send a report when something in the app itself goes wrong?",
      `So faults in Verse Shards for PC get found and fixed. Where in the app it went wrong and the error, with every file path cut down to the file name and anything in quotes taken out. Never Game.log lines, your handle, your files or screenshots. At most every 30 minutes.`,
      yn("errors", "Yes, send them", "No") + now(st.errors)],
  ].filter(([k]) => !ask || ask.includes(k));
  if (!qs.length) return;
  const isNew = ask && ask.length && !ask.includes("game");
  const w = document.createElement("div");
  w.className = "wiz"; w.id = "wiz"; w.setAttribute("role", "dialog"); w.setAttribute("aria-modal", "true"); w.setAttribute("aria-labelledby", "wzTitle");
  const many = qs.length === 1 ? "1 new question" : `${qs.length} ${isNew ? "new " : ""}questions`;
  w.innerHTML = `<div class="box"><header><h2 id="wzTitle">${isNew ? `This version brings ${many}` : `Before you start: ${qs.length} quick questions`}</h2>
    <p>${isNew ? "Your earlier answers are kept. " : ""}Each one needs a yes or a no, so nothing gets missed. You can change any of them later on the Set up tab.</p></header>
    ${qs.map(([k, eb, h, p, a], i) => `<section class="wq" id="wq-${k}"><span class="qn">${i + 1} of ${qs.length} · ${eb}</span><h3>${h}</h3><p>${p}</p>${a}</section>`).join("")}
    <footer><span class="sub" id="wzLeft"></span><span class="grow"></span><button class="btn big" data-protected="true" id="wzDone" disabled>Save and start</button></footer></div>`;
  document.body.appendChild(w);
  document.body.style.overflow = "hidden";
  const update = () => {
    const pathOk = A.game !== "other" || ($("wzPath") && $("wzPath").value.trim().length > 2);
    const left = qs.filter(([k]) => A[k] === undefined || (k === "game" && !pathOk)).length;
    $("wzLeft").textContent = left ? `${left} still to answer` : "All answered.";
    $("wzDone").disabled = !!left;
    qs.forEach(([k]) => $("wq-" + k).classList.toggle("done", A[k] !== undefined && (k !== "game" || pathOk)));
  };
  w.querySelectorAll(".ans").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = g.dataset.q;
    A[k] = b.dataset.v === "1" ? true : b.dataset.v === "0" ? false : b.dataset.v;
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (k === "game") { $("wzPathRow").hidden = A.game !== "other"; if (A.game === "other") $("wzPath").focus(); }
    update();
  }));
  if ($("wzPath")) $("wzPath").oninput = update;
  $("wzDone").onclick = async () => {
    const choices = {...A, game: A.game === "other" ? $("wzPath").value.trim() : A.game};
    $("wzDone").disabled = true;
    try {
      const r = await api("/api/setup", {choices});
      toast(r.message); w.remove(); document.body.style.overflow = ""; show(tab);
    } catch (e) { toast(e.message, true); $("wzDone").disabled = false; }
  };
  update();
}

show(tab);
api("/api/now").then(d => { header(d); if (d.setup_needed) openWizard(); }).catch(() => {});
</script>
</body>
</html>
