<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse Shards for PC</title>
<meta name="app" content="SC Shard Status v__VERSION__">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0e12; --panel: #12161c; --raise: #181d24; --raise2: #1e242c; --well: #0e1115; --thead: #1a1f27;
  --line: #262d36; --line2: #3a434f; --text: #e7eaee; --muted: #c3cad3;
  --amber: #f2a93b; --on-amber: #1a1103; --teal: #4cc4b0; --rust: #ec7a5e; --fresh: #a9c0d8;
  --amber-bg: rgba(242,169,59,.10); --amber-line: rgba(242,169,59,.55); --teal-bg: rgba(76,196,176,.11); --rust-bg: rgba(236,122,94,.12); --fresh-bg: rgba(169,192,216,.10);
  --ghost: #242b35; --ghost-line: #5b6674; --hover: rgba(255,255,255,.045); --zebra: rgba(255,255,255,.018); --sel: rgba(242,169,59,.10); --sel-hover: rgba(242,169,59,.15);
  --field: #0c0f13; --star: rgba(214,226,240,.32); --limb: rgba(242,169,59,.09); --limb-line: rgba(242,169,59,.42);
  --shadow: 0 16px 40px rgba(0,0,0,.5); --edge: inset 0 1px 0 rgba(255,255,255,.035);
  --font: "Bahnschrift", "DIN Alternate", "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  --r: 4px; --r-sm: 3px; --h: 2.25rem; --h-sm: 1.875rem;
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.25rem; --s6: 1.5rem; --s7: 2rem;
  --rail: 18.5rem; --panelw: min(36rem, 100vw);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9ecef; --panel: #f9fafb; --raise: #ffffff; --raise2: #f0f2f5; --well: #f2f4f6; --thead: #eef1f4;
    --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
    --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
    --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
    --ghost: #ffffff; --ghost-line: #8e98a4; --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);
    --field: #ffffff; --star: transparent; --limb: rgba(140,80,0,.05); --limb-line: rgba(140,80,0,.32);
    --shadow: 0 14px 34px rgba(20,32,48,.16); --edge: inset 0 1px 0 rgba(255,255,255,.7);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ecef; --panel: #f9fafb; --raise: #ffffff; --raise2: #f0f2f5; --well: #f2f4f6; --thead: #eef1f4;
  --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
  --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
  --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
  --ghost: #ffffff; --ghost-line: #8e98a4; --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);
  --field: #ffffff; --star: transparent; --limb: rgba(140,80,0,.05); --limb-line: rgba(140,80,0,.32);
  --shadow: 0 14px 34px rgba(20,32,48,.16); --edge: inset 0 1px 0 rgba(255,255,255,.7);
}
* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { margin: 0; }
body { min-height: 100vh; color: var(--text); background: var(--bg); font: 400 .9375rem/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 37px 61px, var(--star) 0 .7px, transparent 1.3px) 0 0 / 460px 460px,
    radial-gradient(circle at 211px 143px, var(--star) 0 .6px, transparent 1.2px) 0 0 / 460px 460px,
    radial-gradient(circle at 389px 297px, var(--star) 0 .8px, transparent 1.4px) 0 0 / 460px 460px,
    radial-gradient(circle at 121px 402px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(1100px 520px at 100% -12%, var(--fresh-bg), transparent 62%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--teal); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--text); }
h1, h2, h3, h4 { text-wrap: balance; }
p, li { text-wrap: pretty; }
code, pre { font: .8125rem var(--mono); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.caps, th, .tabbar button, .cell dt, .eyebrow, .sec > h3 { font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }

.frame { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--edge); }
.wrap { max-width: 92rem; margin: 0 auto; padding: 0 var(--s7) 5rem; }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); padding: var(--s5) 0 0; }
.brand { display: flex; gap: var(--s3); align-items: center; }
.mark { color: var(--amber); display: grid; }
.brand h1 { font-size: 1.1875rem; font-weight: 700; font-stretch: condensed; letter-spacing: .04em; text-transform: uppercase; margin: 0; line-height: 1.1; }
.brand p { font-size: .75rem; color: var(--muted); margin: 2px 0 0; }
.pill { display: inline-flex; align-items: center; gap: var(--s2); height: 1.75rem; padding: 0 var(--s3); border: 1px solid var(--line2); border-radius: 99px; font-size: .8125rem; color: var(--muted); background: var(--panel); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
.pill.on i { background: var(--teal); } .pill.warn i { background: var(--amber); }
.top .grow { flex: 1; }
a.pill.plink { text-decoration: none; color: var(--text); border-color: var(--amber-line); }
a.pill.plink:hover { background: var(--amber-bg); }
a.pill.plink.comm { border-color: var(--teal); }
a.pill.plink.comm:hover { background: var(--teal-bg); }
button.pill.upd { font: inherit; cursor: pointer; background: var(--amber-bg); border-color: var(--amber); color: var(--text); font-weight: 600; }
button.pill.upd:hover { background: var(--amber); color: var(--on-amber, #1a1208); }
.upbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: var(--s2); }
.upbar i { display: block; height: 100%; background: var(--amber); }
.relnotes { white-space: pre-wrap; font-size: .8125rem; color: var(--muted); max-height: 14rem; overflow: auto; margin: var(--s2) 0 0; }

/* Tabs */
.tabbar { position: sticky; top: 0; z-index: 10; display: flex; height: 3rem; margin: var(--s5) calc(-1 * var(--s7)) 0; padding: 0 calc(var(--s7) - var(--s3)); overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: none; border: 0; color: var(--muted); font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.tabbar button:hover, .tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--amber); }
.tabbar .t2 { margin-left: auto; }
.tabbar .tsetup { align-self: center; height: 2.125rem; margin-right: var(--s2); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber-bg); color: var(--text); }
.tabbar .tsetup:hover { background: var(--sel-hover); }
.tabbar .tsetup svg { color: var(--amber); }
.tabbar .tsetup[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.tabbar .tsetup[aria-selected="true"] svg { color: var(--on-amber); }
.tabbar .tsetup[aria-selected="true"]::after { display: none; }
.tabbar .tsetup .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); box-shadow: 0 0 0 2px var(--bg); }
.tabbar .tsetup .dot[hidden] { display: none; }
.count { font-size: .6875rem; line-height: 1.125rem; min-width: 1.375rem; padding: 0 5px; text-align: center; border-radius: 2px; background: var(--raise2); color: var(--muted); font-weight: 700; letter-spacing: 0; }
.count.rust { color: var(--rust); background: var(--rust-bg); }
.count:empty { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--h); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber); color: var(--on-amber); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.08); color: var(--on-amber); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: var(--ghost); color: var(--text); border-color: var(--ghost-line); box-shadow: var(--edge); }
.btn.ghost:hover { filter: none; background: var(--amber-bg); border-color: var(--amber); color: var(--text); }
.btn.sm { height: var(--h-sm); padding: 0 var(--s3); font-size: .8125rem; }
.btn.big { height: 3rem; padding: 0 var(--s6); font-size: 1.0625rem; }
.link { background: none; border: 0; padding: 2px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.link:hover { color: var(--text); }
select { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); }
.inp { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); min-width: 16rem; }
.inp:focus, select:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; background: var(--field); }
.seg button { height: var(--h-sm); background: none; border: 0; border-left: 1px solid var(--line2); padding: 0 var(--s3); color: var(--muted); font-weight: 600; font-size: .8125rem; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--raise2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }

/* Sections and cells */
.sec { margin-top: var(--s6); }
.sec > h3 { display: flex; align-items: baseline; gap: var(--s3); margin: 0 0 var(--s3); font-size: .8125rem; font-weight: 700; color: var(--muted); }
.sec > h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.intro { color: var(--muted); max-width: 75ch; margin: var(--s2) 0 0; }
.sub { color: var(--muted); font-size: .875rem; }
.readout { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s7); margin: 0; }
.cell { min-width: 0; padding-left: var(--s3); border-left: 2px solid var(--line2); }
.cell.good { border-left-color: var(--st-good); } .cell.warn { border-left-color: var(--st-poor); } .cell.rust { border-left-color: var(--st-bad); }
.cell dt { font-size: .6875rem; font-weight: 600; color: var(--muted); }
.cell dd { margin: 2px 0 0; font-size: 1.375rem; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.cell dd small { font-size: .8125rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.cell .sub { display: block; white-space: normal; }
.cell dd { overflow-wrap: anywhere; }
@media (max-width: 760px) { .cell dd { white-space: normal; } }

/* Now: hero */
.hero { margin-top: var(--s5); padding: var(--s6); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s5) var(--s7); align-items: center; overflow: hidden; background: linear-gradient(180deg, var(--raise), var(--panel) 70%); }
.hero::before { content: ""; position: absolute; pointer-events: none; width: 44rem; height: 44rem; right: -14rem; top: 62%; border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, var(--limb), transparent 42%); box-shadow: inset 0 1px 0 var(--limb-line); }
.dial { position: relative; width: 11rem; height: 11rem; z-index: 1; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .val b { font-size: 3.25rem; font-weight: 700; line-height: 1; font-stretch: semi-condensed; }
.dial .val span { font-size: .8125rem; color: var(--muted); }
.hmain { position: relative; z-index: 1; display: grid; gap: var(--s3); min-width: 0; }
.verdict { display: inline-flex; align-items: center; gap: var(--s2); font-size: .8125rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.v-good { color: var(--st-good); } .v-ok { color: var(--st-ok); } .v-poor { color: var(--st-poor); } .v-bad { color: var(--st-bad); }
.summary { font-size: 1.375rem; font-weight: 600; line-height: 1.35; margin: 0; max-width: 60ch; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
.notice { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; padding: var(--s2) var(--s3); border: 1px solid var(--line2); border-left: 2px solid var(--amber); background: var(--raise); border-radius: var(--r-sm); font-size: .875rem; }
.notice.rust { border-left-color: var(--rust); } .notice.teal { border-left-color: var(--teal); }
.notice p, .notice .nt { margin: 0; flex: 1; }
.notice .nt p + p, .notice .nt ul { margin-top: var(--s1); } .notice .nt ul { margin-bottom: 0; padding-left: 1.2em; }
.find .cfix { border-left: 2px solid var(--teal); padding-left: var(--s2); } .find .cfix.warn { border-left-color: var(--amber); }
.shardline { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); align-items: center; font-size: .8125rem; color: var(--muted); }
.shardline code { color: var(--text); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: var(--s4); }
.card { padding: var(--s4) var(--s5); }
.card h4 { margin: 0 0 var(--s1); font-size: .875rem; }
.chart { position: relative; height: 9rem; margin-top: var(--s2); }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: .6875rem var(--font); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .hit { fill: transparent; }
.chart .xh { stroke: var(--line2); stroke-width: 1; }
.chart .dot { stroke: var(--panel); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; z-index: 5; padding: 6px 10px; background: var(--raise2); border: 1px solid var(--line2); border-radius: var(--r-sm); font-size: .8125rem; white-space: nowrap; box-shadow: var(--shadow); transform: translate(-50%, -110%); }
.tip b { display: block; font-size: .75rem; color: var(--muted); font-weight: 500; }
.nochart { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: .875rem; border: 1px dashed var(--line2); border-radius: var(--r-sm); }

/* Findings */
.checkbar { margin-top: var(--s5); padding: var(--s5) var(--s6); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); }
.checkbar p { margin: 0; flex: 1 1 24rem; color: var(--muted); }
.headline { margin: var(--s5) 0 0; font-size: 1.25rem; font-weight: 600; }
.finds { display: grid; gap: var(--s3); margin-top: var(--s4); }
.find { padding: var(--s4) var(--s5); border-left: 3px solid var(--line2); }
.find.high { border-left-color: var(--st-bad); } .find.medium { border-left-color: var(--st-poor); } .find.low { border-left-color: var(--st-ok); }
.fh { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: baseline; }
.fh h4 { margin: 0; font-size: 1.0625rem; flex: 1 1 24rem; }
.chip { display: inline-flex; align-items: center; height: 1.25rem; font-size: .6875rem; padding: 0 6px; border-radius: 2px; font-weight: 700; white-space: nowrap; letter-spacing: .05em; text-transform: uppercase; }
.chip.high { color: var(--st-bad); background: var(--st-bad-bg); } .chip.medium { color: var(--st-poor); background: var(--st-poor-bg); }
.chip.low, .chip.info { color: var(--st-ok); background: var(--st-ok-bg); } .chip.area, .chip.unknown { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); }
.find p { margin: var(--s2) 0 0; max-width: 85ch; }
.find ul { margin: var(--s2) 0 0; padding-left: 1.2rem; }
.find li { margin: 2px 0; }
.fa { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); align-items: center; }
details.ex { margin-top: var(--s2); }
details.ex summary { cursor: pointer; color: var(--muted); font-size: .8125rem; }
pre.lines { margin: var(--s2) 0 0; padding: var(--s3); background: var(--well); border: 1px solid var(--line); border-radius: var(--r-sm); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow-y: auto; color: var(--muted); }

/* Tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .6875rem; font-weight: 700; color: var(--text); padding: var(--s2) var(--s3); background: var(--thead); white-space: nowrap; box-shadow: inset 0 -2px 0 var(--amber); }
td { padding: 6px var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--zebra); }
tbody tr:hover td { background: var(--hover); }
.num { text-align: right; white-space: nowrap; }
td.bad { color: var(--rust); font-weight: 600; } td.okc { color: var(--teal); }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; z-index: 20; width: min(46rem, 100vw); height: 100vh; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line2); box-shadow: var(--shadow); transform: translateX(102%); visibility: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s linear .2s; }
.drawer.open { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(4,6,9,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.show { opacity: 1; pointer-events: auto; }
.dh { position: sticky; top: 0; z-index: 2; padding: var(--s5) 3.5rem var(--s4) var(--s6); background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--amber); }
.dh h2 { margin: var(--s1) 0 0; font-size: 1.375rem; font-weight: 700; font-stretch: condensed; line-height: 1.15; }
.dh .close { position: absolute; top: var(--s3); right: var(--s3); width: var(--h); height: var(--h); background: none; border: 0; color: var(--muted); font-size: 1.25rem; }
.db { padding: var(--s4) var(--s6) 3rem; display: grid; gap: var(--s4); }
.db textarea { width: 100%; min-height: 26rem; background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: var(--s3); font: .8125rem/1.5 var(--mono); color: var(--text); resize: vertical; }
.steps { margin: 0; padding-left: 1.2rem; display: grid; gap: var(--s1); }
.rsec { display: grid; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
.rhd { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.rhd h4 { margin: 0; font-size: .75rem; font-weight: 700; color: var(--muted); font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }
.db textarea.rta { min-height: 4.5rem; resize: vertical; font: .875rem/1.5 var(--font); overflow: hidden; }
.db textarea.rta.one { min-height: 0; font-weight: 600; }
.steps-ed { display: grid; gap: var(--s2); }
.rsec > .link { justify-self: start; }
.steprow { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto auto; gap: var(--s2); align-items: center; }
.steprow .sn { width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border-radius: 50%; background: var(--raise2); color: var(--amber); font-weight: 700; font-size: .8125rem; }
.steprow .inp { min-width: 0; width: 100%; }
.iconx { width: var(--h-sm); height: var(--h-sm); background: none; border: 0; color: var(--muted); border-radius: var(--r-sm); }
.iconx:hover { color: var(--rust); background: var(--hover); }

/* Library */
.lib { display: grid; gap: var(--s2); margin-top: var(--s3); }
.lib details { padding: var(--s3) var(--s4); }
.lib summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; font-weight: 600; }
.lib summary span.t { flex: 1 1 20rem; }

/* About */
.about { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--s5); align-items: start; padding: var(--s5) var(--s6); }
.about img { width: 9rem; height: 9rem; object-fit: cover; border-radius: var(--r); border: 1px solid var(--line2); }
.about h2 { margin: 0; font-size: 1.5rem; font-stretch: condensed; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--s3); }
.tile { padding: var(--s4); display: grid; gap: var(--s1); text-decoration: none; color: var(--text); }
.tile:hover { border-color: var(--amber-line); color: var(--text); }
.tile b { font-size: 1rem; } .tile span { color: var(--muted); font-size: .875rem; }
.tile .go { color: var(--teal); font-weight: 600; font-size: .875rem; }
table.comm .score, .score { display: inline-flex; align-items: center; gap: var(--s2); font-weight: 700; }
table.comm tr.me td { background: var(--sel); }
.promo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s5); align-items: center; padding: var(--s4) var(--s5); text-decoration: none; color: var(--text); }
.promo:hover { border-color: var(--amber-line); color: var(--text); }
.promo b { font-size: 1.0625rem; } .promo > span:not(.btn) { grid-column: 1; color: var(--muted); font-size: .875rem; }
.promo .eyebrow { color: var(--amber); }
.promo .btn { grid-column: 2; grid-row: 1 / span 3; }
.setcard { padding: var(--s5); display: grid; gap: var(--s3); }
.setcard h4 { margin: 0; font-size: 1.0625rem; }
.setcard p { margin: 0; max-width: 80ch; }
.cmd { display: inline-flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); background: var(--well); border: 1px solid var(--line2); border-radius: var(--r-sm); font: 1rem var(--mono); color: var(--text); justify-self: start; }
.state { display: inline-flex; align-items: center; gap: var(--s2); font-size: .875rem; font-weight: 600; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.state.on { color: var(--teal); } .state.on i { background: var(--teal); }
table.switches td { vertical-align: middle; }
table.switches td .sub { display: block; }
table.switches td:last-child { white-space: nowrap; }
.cmdsm { font: .875rem var(--mono); color: var(--text); background: var(--well); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 2px 6px; white-space: nowrap; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: var(--s2); max-width: 85ch; }
.foot { margin-top: var(--s7); color: var(--muted); font-size: .8125rem; display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }

.swrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5); padding: var(--s3) 0; border-top: 1px solid var(--line); width: 100%; }
.swrow:first-child { border-top: 0; }
.swl { flex: 1 1 22rem; display: grid; gap: 2px; }
.swl b { font-size: .9375rem; }
.onoff { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; }
.onoff button { min-width: 4.5rem; height: 2.125rem; background: var(--field); border: 0; color: var(--muted); font-weight: 700; }
.onoff button + button { border-left: 1px solid var(--line2); }
.onoff button[data-v="1"][aria-pressed="true"] { background: var(--teal); color: var(--on-amber); }
.onoff button[data-v="0"][aria-pressed="true"] { background: var(--raise2); color: var(--text); }
.onoff button[aria-pressed="false"]:hover { color: var(--text); background: var(--hover); }
.chipt { display: inline-flex; align-items: center; gap: var(--s2); height: var(--h); padding: 0 var(--s3) 0 var(--s2); border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--field); font-size: .875rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.chipt:hover { color: var(--text); border-color: var(--muted); }
.chipt input { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 0; border: 1.5px solid var(--line2); border-radius: 2px; background: var(--field); }
.chipt input:checked { background: var(--amber); border-color: var(--amber); box-shadow: inset 0 0 0 2px var(--field); }
.chipt:has(input:checked) { color: var(--text); border-color: var(--amber-line); }
.chipt:has(input:focus-visible) { outline: 2px solid var(--amber); outline-offset: 2px; }

.alist { padding: var(--s3) var(--s4); display: grid; gap: var(--s2); font-size: .875rem; }
.alist > div { display: grid; grid-template-columns: 4rem 1fr; gap: var(--s3); }
.alist > div > b { color: var(--muted); font-weight: 600; }
/* Timeline */
.tlbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); padding: var(--s3) var(--s4); }
.tlbar .grow { flex: 1; }
.tlf { display: flex; flex-wrap: wrap; gap: var(--s2); }
.tlf button { height: 1.75rem; padding: 0 var(--s3); border: 1px solid var(--line2); border-radius: 999px; background: none; color: var(--muted); font-size: .8125rem; font-weight: 600; }
.tlf button[aria-pressed="true"] { color: var(--text); border-color: var(--amber); background: var(--amber-bg); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 4.25rem 1.25rem 1fr; gap: var(--s3); align-items: start; padding: 6px var(--s4); border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8125rem; padding-top: 1px; }
.tl .k { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--line2); }
.tl .g-travel .k { background: var(--fresh); } .tl .g-place .k { background: var(--teal); } .tl .g-ship .k { background: var(--amber); }
.tl .g-contract .k { background: #b392f0; } .tl .g-connection .k { background: var(--muted); } .tl li.bad .k { background: var(--rust); }
.tl .x { font: .75rem var(--mono); color: var(--muted); margin-left: var(--s2); }
.tl li.day { display: block; padding: var(--s2) var(--s4); background: var(--well); color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
/* First-run questions */
.wiz { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: rgba(4,6,9,.78); padding: var(--s6) var(--s4) 0; }
.wiz .box { max-width: 54rem; margin: 0 auto var(--s6); background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); box-shadow: var(--shadow); }
.wiz header { padding: var(--s6) var(--s6) var(--s4); border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--amber); }
.wiz header h2 { margin: 0; font-size: 1.5rem; }
.wiz header p { margin: var(--s2) 0 0; color: var(--muted); max-width: 70ch; }
.wq { padding: var(--s5) var(--s6); border-bottom: 1px solid var(--line); display: grid; gap: var(--s2); }
.wq.done { background: linear-gradient(90deg, var(--teal-bg), transparent 40%); }
.wq .qn { font-size: .75rem; font-weight: 700; color: var(--amber); letter-spacing: .07em; text-transform: uppercase; }
.wq.done .qn { color: var(--teal); }
.wq h3 { margin: 0; font-size: 1.125rem; }
.wq p { margin: 0; color: var(--muted); max-width: 75ch; font-size: .9rem; }
.wq .ans { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); align-items: center; }
.wq .ans button { min-width: 9rem; height: 2.5rem; padding: 0 var(--s4); border-radius: var(--r-sm); border: 1px solid var(--ghost-line); background: var(--ghost); color: var(--text); font-weight: 600; }
.wq .ans button:hover { border-color: var(--amber); background: var(--amber-bg); }
.wq .ans button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.wq .now { font-size: .8125rem; color: var(--muted); }
.wiz footer { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); padding: var(--s4) var(--s6); background: var(--panel); border-top: 1px solid var(--line2); }
.wiz footer .grow { flex: 1; }
.toast { position: fixed; left: 50%; bottom: var(--s5); transform: translateX(-50%); z-index: 30; padding: var(--s3) var(--s5); background: var(--raise2); border: 1px solid var(--line2); border-left: 3px solid var(--teal); border-radius: var(--r-sm); box-shadow: var(--shadow); max-width: min(40rem, 90vw); }
.toast.err { border-left-color: var(--rust); }
.empty { margin-top: var(--s4); padding: var(--s7) var(--s6); text-align: center; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); }
.empty h3 { margin: 0 0 var(--s1); color: var(--text); font-size: 1.0625rem; }
.empty p { margin: 0 auto; max-width: 60ch; }

@media (max-width: 760px) {
  .wrap { padding: 0 var(--s4) 4rem; }
  .tabbar { margin: var(--s4) calc(-1 * var(--s4)) 0; padding: 0 var(--s2); }
  .hero { grid-template-columns: 1fr; padding: var(--s5); justify-items: start; }
  .dial { width: 8.5rem; height: 8.5rem; }
  .summary { font-size: 1.125rem; }
  .about { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }

/* 1.3 */
button.pill.mark { font: inherit; cursor: pointer; background: var(--teal-bg); border-color: var(--teal); color: var(--text); font-weight: 600; }
button.pill.mark:hover { background: var(--teal); color: #06221d; }
.copyl { display: grid; gap: var(--s2); padding: var(--s3) var(--s4); }
.copyl .cl { display: flex; gap: var(--s3); align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: var(--s2); }
.copyl .cl:first-of-type { border-top: 0; padding-top: 0; }
.copyl .cl span { flex: 1 1 auto; overflow-wrap: anywhere; }
.copyl .cl.fts span { color: var(--muted); }
.marks { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s3); }
.find.near { box-shadow: inset 3px 0 0 var(--teal); }
.cnt { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cnt.over { color: var(--rust); font-weight: 700; }
.rhd .grow { flex: 1; }
.rsec .note { font-size: .8125rem; color: var(--muted); margin: 0; }
.rsec select.inp { max-width: 16rem; }
.contrib { border: 1px solid var(--teal); background: var(--teal-bg); border-radius: var(--r-sm); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); }
.gform { display: grid; gap: var(--s3); padding: var(--s4) var(--s5); }
.gform .row { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end; }
.gform label { display: grid; gap: 4px; font-size: .8125rem; color: var(--muted); font-weight: 600; flex: 1 1 12rem; }
.starline { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s4); border-left: 2px solid var(--amber); }
.starline p { margin: 0; flex: 1 1 20rem; }

/* 1.4: status colours, each with its own shape, the same as on Verse Shards */
:root { --st-good: #4cc4b0; --st-ok: #c9d1db; --st-poor: #ffd166; --st-bad: #ec7a5e; --ctl: #5f6b79;
  --st-good-bg: rgba(76,196,176,.12); --st-ok-bg: rgba(201,209,219,.10); --st-poor-bg: rgba(255,209,102,.12); --st-bad-bg: rgba(236,122,94,.13); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --st-good: #0a6b5f; --st-ok: #6f7a88; --st-poor: #9a6b00; --st-bad: #a23a22; --ctl: #77818d;
  --st-good-bg: rgba(10,107,95,.09); --st-ok-bg: rgba(111,122,136,.10); --st-poor-bg: rgba(154,107,0,.10); --st-bad-bg: rgba(162,58,34,.09); } }
:root[data-theme="light"] { --st-good: #0a6b5f; --st-ok: #6f7a88; --st-poor: #9a6b00; --st-bad: #a23a22; --ctl: #77818d;
  --st-good-bg: rgba(10,107,95,.09); --st-ok-bg: rgba(111,122,136,.10); --st-poor-bg: rgba(154,107,0,.10); --st-bad-bg: rgba(162,58,34,.09); }
.verdict i, .score i, i.st { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--line2); }
.v-good i, .score.good i, i.st.good { background: var(--st-good); }
.v-ok i, .score.ok i, i.st.ok { background: linear-gradient(90deg, var(--st-ok) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--st-ok); }
.v-poor i, .score.poor i, i.st.poor { border-radius: 0; background: var(--st-poor); clip-path: polygon(50% 4%, 100% 96%, 0 96%); }
.v-bad i, .score.bad i, i.st.bad { border-radius: 0; background: var(--st-bad); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }

/* Header: status reads as status, not buttons */
.stat { display: inline-flex; align-items: center; gap: var(--s2); font-size: .8125rem; color: var(--muted); white-space: nowrap; }
.stat i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.stat.on { color: var(--text); } .stat.on i { background: var(--st-good); } .stat.warn i { background: var(--st-poor); }
.top .hlink { font-size: .875rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.top .hlink:hover { text-decoration: underline; }

/* Now: the next step sits under the verdict */
.bestmove { display: grid; gap: 2px; max-width: 62ch; padding: var(--s3) var(--s4); border: 1px solid var(--st-good); border-left-width: 3px; background: var(--st-good-bg); border-radius: var(--r-sm); }
.bestmove .eyebrow { color: var(--st-good); font-size: .75rem; font-weight: 700; }
.bestmove p { margin: 0; }
.hacts { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
details.why { max-width: 62ch; }
details.why > summary { cursor: pointer; color: var(--muted); font-size: .875rem; width: fit-content; }
details.why > summary:hover { color: var(--text); }
details.why[open] > summary { margin-bottom: var(--s2); }
.goodline { margin: 0; color: var(--st-good); font-weight: 600; }

/* Copy for chat: one line, more behind a fold */
.chatbox { display: grid; gap: var(--s2); padding: var(--s3) var(--s4); }
.chatbox h4 { margin: 0; font-size: .875rem; }
.chatbox .rhd { flex-wrap: wrap; }
.chatbox label { display: inline-flex; gap: 6px; align-items: center; }
.chatline { display: flex; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); background: var(--well); border: 1px solid var(--line); border-radius: var(--r-sm); font: .875rem/1.4 var(--mono); }
.chatline span { flex: 1; overflow-wrap: anywhere; }
.chatline .btn { font-family: var(--font); }
.chatmore { display: grid; gap: var(--s2); margin-top: var(--s2); }
.chatbox details.ex { margin: 0; }
.chatbox details.ex > summary { cursor: pointer; color: var(--muted); font-size: .8125rem; width: fit-content; }

/* Groups: the same card as on Verse Shards */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: var(--s3); }
.gcard { padding: var(--s4); display: grid; gap: var(--s2); align-content: start; }
.gcard .gh { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: center; }
.gcard .gt { font-weight: 600; font-size: 1rem; }
.gcard .gf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); }
.gicon { flex: none; width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--raise2); font: 700 .75rem var(--font); color: var(--amber); letter-spacing: .04em; }
.gicon.sm { width: 1.5rem; height: 1.5rem; font-size: .625rem; }
.pips { display: inline-flex; gap: 3px; margin-right: var(--s2); vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ctl); }
.pips i.on { background: var(--st-good); box-shadow: none; }
.tleft { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tleft i { display: block; height: 100%; background: var(--st-good); }
.tleft.ending i { background: var(--st-poor); }
.achips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.achip { display: inline-flex; align-items: center; gap: var(--s2); height: 2rem; padding: 0 var(--s3) 0 4px; border: 1px solid var(--ctl); border-radius: 99px; background: var(--field); color: var(--text); font-size: .8125rem; font-weight: 600; }
.achip:hover { border-color: var(--amber); }
.achip[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber); }
.achip .gicon { border-radius: 50%; }
.stepper { display: inline-flex; align-items: center; height: var(--h); border: 1px solid var(--ctl); border-radius: var(--r-sm); background: var(--field); width: fit-content; }
.stepper button { width: 2.25rem; height: 100%; background: none; border: 0; font-size: 1.125rem; font-weight: 700; color: var(--text); }
.stepper button:hover { background: var(--hover); }
.stepper output { min-width: 2rem; text-align: center; font-weight: 700; color: var(--text); }
.gform .lbl { display: grid; gap: 4px; font-size: .8125rem; color: var(--muted); font-weight: 600; flex: 0 0 auto; }
.gform .hint { font-weight: 400; color: var(--muted); }
.gform .rhd h4 { margin: 0; }
.pline { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; justify-content: space-between; padding: var(--s3) var(--s4); }
.pline p { margin: 0; flex: 1 1 20rem; }
.keen .cl > span { display: flex; gap: var(--s2); align-items: center; }

/* ===== Design pass, Oct 2026 (Claude). Port as a block; every rule here is new or overrides one above. ===== */
.dial .val span, .readout dt { font-size: .8125rem; }
/* tab bar: wraps onto a second row instead of cutting Set up and About off in a narrow window */
@media (max-width: 1180px) {
  .tabbar { flex-wrap: wrap; height: auto; overflow: visible; row-gap: 0; }
  .tabbar button { height: 2.75rem; padding: 0 var(--s2); font-size: .875rem; }
  .tabbar .tsetup { height: 2rem; padding: 0 var(--s3); }
}
.seg button, .achip { white-space: nowrap; }
/* score ring: sweep once per run, marker on the tip, dotted track for what's missing */
.dial circle.track { stroke-opacity: .2; }
.dial .tip { transform-box: view-box; transform-origin: 60px 60px; transform: rotate(var(--ang)); transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.dial circle.arc { transition: stroke-dasharray .8s cubic-bezier(.2,.8,.2,1); }
.dial svg.sweep circle.arc { animation: ringArc 1.1s cubic-bezier(.2,.7,.2,1) both; }
.dial svg.sweep .tip { animation: ringTip 1.1s cubic-bezier(.2,.7,.2,1) both; }
@keyframes ringArc { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes ringTip { from { transform: rotate(0deg); } to { transform: rotate(var(--ang)); } }
/* pirate line on Now: same strip as the site's board */
.pirate { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s3); max-width: 62ch; padding: 6px var(--s3) 6px calc(var(--s3) + 4px); border-radius: var(--r-sm); background: rgba(236,122,94,.13); border: 1px solid rgba(236,122,94,.38); animation: pirGlow 1s ease-in-out 3, pirGlowCycle 6s ease-in-out 4s infinite; }
.pirate .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--st-bad); animation: pirBlink .5s steps(1) 6, pirBlinkCycle 6s steps(1) 4s infinite; }
.pirate .plab { font: 700 .75rem/1 var(--font); letter-spacing: .1em; text-transform: uppercase; font-stretch: semi-condensed; background: var(--st-bad); color: #1a1103; padding: 4px 6px; border-radius: 2px; }
.pirate .ptxt { flex: 1 1 14rem; font-size: .9375rem; }
.pirate .pclr { font-size: .8125rem; color: #f4a48f; white-space: nowrap; }
.pirate.one { background: rgba(255,209,102,.12); border-color: rgba(255,209,102,.38); animation: none; }
.pirate.one .edge, .pirate.one .plab { background: var(--st-poor); } .pirate.one .edge { animation: pirBlink .5s steps(1) 4; } .pirate.one .pclr { color: var(--st-poor); }
@keyframes pirGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(236,122,94,0); } 50% { box-shadow: 0 0 0 4px rgba(236,122,94,.28); } }
@keyframes pirGlowCycle { 0%, 10%, 100% { box-shadow: 0 0 0 0 rgba(236,122,94,0); } 5% { box-shadow: 0 0 0 4px rgba(236,122,94,.28); } }
@keyframes pirBlink { 0% { opacity: 1; } 50% { opacity: .15; } }
@keyframes pirBlinkCycle { 0% { opacity: 1; } 2% { opacity: .15; } 4% { opacity: 1; } 6% { opacity: .15; } 8%, 100% { opacity: 1; } }
.chatline.src span { color: var(--muted); }
/* my pilot */
.pilot { display: grid; gap: var(--s4); }

/* group card, matching the site */

.hpill.none span { color: var(--muted); }

.hpill.bad { background: var(--st-bad-bg); } .hpill.bad i { background: var(--st-bad); } .hpill.bad span { color: var(--st-bad); }

/* keen list */

.keenl .ka { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

i.st.new { background: var(--amber); }
/* composer details */
.gdet { display: grid; gap: 6px; } .gdet .lbl { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: baseline; font-size: .8125rem; color: var(--muted); font-weight: 600; }

.dg { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }

@media (prefers-reduced-motion: reduce) { .pirate, .pirate *, .dial svg.sweep * { animation: none !important; } }
/* ===== Now tab: cockpit HUD (direction 1b). Port as a block. ===== */
.hud { margin-top: var(--s5); border-radius: var(--r); background: var(--panel); overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.hud.calm { animation: hudCalm 5s ease-in-out infinite; }

.hazard { height: 8px; border-radius: 3px; background: repeating-linear-gradient(135deg, #ec7a5e 0 10px, #1a1103 10px 20px); background-size: 28px 8px; animation: hazardRun .8s linear infinite; }
@keyframes hazardRun { from { background-position: 0 0; } to { background-position: 28px 0; } }
.crashline { margin: 0; padding: var(--s3) var(--s4); border: 1px solid var(--st-bad); border-left-width: 3px; background: var(--st-bad-bg); border-radius: var(--r-sm); font-size: .9375rem; }

.tx .txa { grid-column: 2; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; }

.hbar { height: 4px; background: var(--raise2); } .hbar i { display: block; height: 100%; transition: width .8s; } .hbar.sweep i { animation: hbarFill 1.1s cubic-bezier(.2,.7,.2,1); }
@keyframes hbarFill { from { width: 0; } }
.hg { display: grid; grid-template-columns: 9.5rem repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); }
@media (max-width: 1100px) { .hg { grid-template-columns: repeat(4, minmax(0, 1fr)); } .hg .gscore { grid-row: span 2; } }

.gbig { font: 700 3rem/1 var(--font); font-stretch: semi-condensed; }
.gv { font: 600 1.5rem/1.1 var(--font); white-space: nowrap; } .gv small { font-size: .8125rem; color: var(--muted); font-weight: 400; }
.gv.good { color: var(--st-good); } .gv.poor { color: var(--st-poor); } .gv.bad { color: var(--st-bad); }
