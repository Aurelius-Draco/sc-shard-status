<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shard status</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0e12; --panel: #12161c; --raise: #181d24; --raise2: #1e242c; --well: #0e1115; --thead: #1a1f27;
  --line: #262d36; --line2: #3a434f; --text: #e7eaee; --muted: #9ea7b3;
  --amber: #f2a93b; --on-amber: #1a1103; --teal: #4cc4b0; --rust: #ec7a5e; --fresh: #a9c0d8;
  --amber-bg: rgba(242,169,59,.10); --amber-line: rgba(242,169,59,.55); --teal-bg: rgba(76,196,176,.11); --rust-bg: rgba(236,122,94,.12); --fresh-bg: rgba(169,192,216,.10);
  --ghost: #242b35; --ghost-line: #5b6674; --hover: rgba(255,255,255,.045); --zebra: rgba(255,255,255,.018); --sel: rgba(242,169,59,.10); --sel-hover: rgba(242,169,59,.15);
  --field: #0c0f13; --star: rgba(214,226,240,.32); --limb: rgba(242,169,59,.09); --limb-line: rgba(242,169,59,.42);
  --shadow: 0 16px 40px rgba(0,0,0,.5); --edge: inset 0 1px 0 rgba(255,255,255,.035);
  --font: "Bahnschrift", "DIN Alternate", "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  --r: 4px; --r-sm: 3px; --h: 2.25rem; --h-sm: 1.875rem;
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.25rem; --s6: 1.5rem; --s7: 2rem;
  --rail: 18.5rem; --panelw: min(36rem, 100vw);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9ecef; --panel: #f9fafb; --raise: #ffffff; --raise2: #f0f2f5; --well: #f2f4f6; --thead: #eef1f4;
    --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
    --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
    --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
    --ghost: #ffffff; --ghost-line: #8e98a4; --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);
    --field: #ffffff; --star: transparent; --limb: rgba(140,80,0,.05); --limb-line: rgba(140,80,0,.32);
    --shadow: 0 14px 34px rgba(20,32,48,.16); --edge: inset 0 1px 0 rgba(255,255,255,.7);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ecef; --panel: #f9fafb; --raise: #ffffff; --raise2: #f0f2f5; --well: #f2f4f6; --thead: #eef1f4;
  --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
  --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
  --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
  --ghost: #ffffff; --ghost-line: #8e98a4; --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);
  --field: #ffffff; --star: transparent; --limb: rgba(140,80,0,.05); --limb-line: rgba(140,80,0,.32);
  --shadow: 0 14px 34px rgba(20,32,48,.16); --edge: inset 0 1px 0 rgba(255,255,255,.7);
}
* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { margin: 0; }
body { min-height: 100vh; color: var(--text); background: var(--bg); font: 400 .9375rem/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 37px 61px, var(--star) 0 .7px, transparent 1.3px) 0 0 / 460px 460px,
    radial-gradient(circle at 211px 143px, var(--star) 0 .6px, transparent 1.2px) 0 0 / 460px 460px,
    radial-gradient(circle at 389px 297px, var(--star) 0 .8px, transparent 1.4px) 0 0 / 460px 460px,
    radial-gradient(circle at 121px 402px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(1100px 520px at 100% -12%, var(--fresh-bg), transparent 62%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--teal); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--text); }
h1, h2, h3, h4 { text-wrap: balance; }
p, li { text-wrap: pretty; }
code, pre { font: .8125rem var(--mono); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.caps, th, .tabbar button, .cell dt, .eyebrow, .sec > h3 { font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }

.frame { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--edge); }
.wrap { max-width: 92rem; margin: 0 auto; padding: 0 var(--s7) 5rem; }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); padding: var(--s5) 0 0; }
.brand { display: flex; gap: var(--s3); align-items: center; }
.mark { color: var(--amber); display: grid; }
.brand h1 { font-size: 1.1875rem; font-weight: 700; font-stretch: condensed; letter-spacing: .04em; text-transform: uppercase; margin: 0; line-height: 1.1; }
.brand p { font-size: .75rem; color: var(--muted); margin: 2px 0 0; }
.pill { display: inline-flex; align-items: center; gap: var(--s2); height: 1.75rem; padding: 0 var(--s3); border: 1px solid var(--line2); border-radius: 99px; font-size: .8125rem; color: var(--muted); background: var(--panel); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
.pill.on i { background: var(--teal); } .pill.warn i { background: var(--amber); }
.top .grow { flex: 1; }
a.pill.plink { text-decoration: none; color: var(--text); border-color: var(--amber-line); }
a.pill.plink:hover { background: var(--amber-bg); }

/* Tabs */
.tabbar { position: sticky; top: 0; z-index: 10; display: flex; height: 3rem; margin: var(--s5) calc(-1 * var(--s7)) 0; padding: 0 calc(var(--s7) - var(--s3)); overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: none; border: 0; color: var(--muted); font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.tabbar button:hover, .tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--amber); }
.tabbar .t2 { margin-left: auto; }
.tabbar .tsetup { align-self: center; height: 2.125rem; margin-right: var(--s2); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber-bg); color: var(--text); }
.tabbar .tsetup:hover { background: var(--sel-hover); }
.tabbar .tsetup svg { color: var(--amber); }
.tabbar .tsetup[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.tabbar .tsetup[aria-selected="true"] svg { color: var(--on-amber); }
.tabbar .tsetup[aria-selected="true"]::after { display: none; }
.tabbar .tsetup .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); box-shadow: 0 0 0 2px var(--bg); }
.tabbar .tsetup .dot[hidden] { display: none; }
.count { font-size: .6875rem; line-height: 1.125rem; min-width: 1.375rem; padding: 0 5px; text-align: center; border-radius: 2px; background: var(--raise2); color: var(--muted); font-weight: 700; letter-spacing: 0; }
.count.rust { color: var(--rust); background: var(--rust-bg); }
.count:empty { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--h); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber); color: var(--on-amber); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.08); color: var(--on-amber); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: var(--ghost); color: var(--text); border-color: var(--ghost-line); box-shadow: var(--edge); }
.btn.ghost:hover { filter: none; background: var(--amber-bg); border-color: var(--amber); color: var(--text); }
.btn.sm { height: var(--h-sm); padding: 0 var(--s3); font-size: .8125rem; }
.btn.big { height: 3rem; padding: 0 var(--s6); font-size: 1.0625rem; }
.link { background: none; border: 0; padding: 2px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.link:hover { color: var(--text); }
select { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); }
.inp { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); min-width: 16rem; }
.inp:focus, select:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; background: var(--field); }
.seg button { height: var(--h-sm); background: none; border: 0; border-left: 1px solid var(--line2); padding: 0 var(--s3); color: var(--muted); font-weight: 600; font-size: .8125rem; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--raise2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }

/* Sections and cells */
.sec { margin-top: var(--s6); }
.sec > h3 { display: flex; align-items: baseline; gap: var(--s3); margin: 0 0 var(--s3); font-size: .75rem; font-weight: 700; color: var(--muted); }
.sec > h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.intro { color: var(--muted); max-width: 75ch; margin: var(--s2) 0 0; }
.sub { color: var(--muted); font-size: .8125rem; }
.readout { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s7); margin: 0; }
.cell { min-width: 0; padding-left: var(--s3); border-left: 2px solid var(--line2); }
.cell.good { border-left-color: var(--teal); } .cell.warn { border-left-color: var(--amber); } .cell.rust { border-left-color: var(--rust); }
.cell dt { font-size: .6875rem; font-weight: 600; color: var(--muted); }
.cell dd { margin: 2px 0 0; font-size: 1.375rem; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.cell dd small { font-size: .8125rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.cell .sub { display: block; white-space: normal; }
.cell dd { overflow-wrap: anywhere; }
@media (max-width: 760px) { .cell dd { white-space: normal; } }

/* Now: hero */
.hero { margin-top: var(--s5); padding: var(--s6); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s5) var(--s7); align-items: center; overflow: hidden; background: linear-gradient(180deg, var(--raise), var(--panel) 70%); }
.hero::before { content: ""; position: absolute; pointer-events: none; width: 44rem; height: 44rem; right: -14rem; top: 62%; border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, var(--limb), transparent 42%); box-shadow: inset 0 1px 0 var(--limb-line); }
.dial { position: relative; width: 11rem; height: 11rem; z-index: 1; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .val b { font-size: 3.25rem; font-weight: 700; line-height: 1; font-stretch: semi-condensed; }
.dial .val span { font-size: .8125rem; color: var(--muted); }
.hmain { position: relative; z-index: 1; display: grid; gap: var(--s3); min-width: 0; }
.verdict { display: inline-flex; align-items: center; gap: var(--s2); font-size: .8125rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.verdict i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.v-good { color: var(--teal); } .v-good i { background: var(--teal); }
.v-ok { color: var(--fresh); } .v-ok i { background: var(--fresh); }
.v-poor { color: var(--amber); } .v-poor i { background: var(--amber); }
.v-bad { color: var(--rust); } .v-bad i { background: var(--rust); }
.summary { font-size: 1.375rem; font-weight: 600; line-height: 1.35; margin: 0; max-width: 60ch; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
.notice { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; padding: var(--s2) var(--s3); border: 1px solid var(--line2); border-left: 2px solid var(--amber); background: var(--raise); border-radius: var(--r-sm); font-size: .875rem; }
.notice.rust { border-left-color: var(--rust); } .notice.teal { border-left-color: var(--teal); }
.notice p { margin: 0; flex: 1; }
.shardline { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); align-items: center; font-size: .8125rem; color: var(--muted); }
.shardline code { color: var(--text); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: var(--s4); }
.card { padding: var(--s4) var(--s5); }
.card h4 { margin: 0 0 var(--s1); font-size: .875rem; }
.chart { position: relative; height: 9rem; margin-top: var(--s2); }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: .6875rem var(--font); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .hit { fill: transparent; }
.chart .xh { stroke: var(--line2); stroke-width: 1; }
.chart .dot { stroke: var(--panel); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; z-index: 5; padding: 6px 10px; background: var(--raise2); border: 1px solid var(--line2); border-radius: var(--r-sm); font-size: .8125rem; white-space: nowrap; box-shadow: var(--shadow); transform: translate(-50%, -110%); }
.tip b { display: block; font-size: .75rem; color: var(--muted); font-weight: 500; }
.nochart { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: .875rem; border: 1px dashed var(--line2); border-radius: var(--r-sm); }

/* Findings */
.checkbar { margin-top: var(--s5); padding: var(--s5) var(--s6); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); }
.checkbar p { margin: 0; flex: 1 1 24rem; color: var(--muted); }
.headline { margin: var(--s5) 0 0; font-size: 1.25rem; font-weight: 600; }
.finds { display: grid; gap: var(--s3); margin-top: var(--s4); }
.find { padding: var(--s4) var(--s5); border-left: 3px solid var(--line2); }
.find.high { border-left-color: var(--rust); } .find.medium { border-left-color: var(--amber); } .find.low { border-left-color: var(--fresh); }
.fh { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: baseline; }
.fh h4 { margin: 0; font-size: 1.0625rem; flex: 1 1 24rem; }
.chip { display: inline-flex; align-items: center; height: 1.25rem; font-size: .6875rem; padding: 0 6px; border-radius: 2px; font-weight: 700; white-space: nowrap; letter-spacing: .05em; text-transform: uppercase; }
.chip.high { color: var(--rust); background: var(--rust-bg); } .chip.medium { color: var(--amber); background: var(--amber-bg); }
.chip.low, .chip.info { color: var(--fresh); background: var(--fresh-bg); } .chip.area, .chip.unknown { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); }
.find p { margin: var(--s2) 0 0; max-width: 85ch; }
.find ul { margin: var(--s2) 0 0; padding-left: 1.2rem; }
.find li { margin: 2px 0; }
.fa { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); align-items: center; }
details.ex { margin-top: var(--s2); }
details.ex summary { cursor: pointer; color: var(--muted); font-size: .8125rem; }
pre.lines { margin: var(--s2) 0 0; padding: var(--s3); background: var(--well); border: 1px solid var(--line); border-radius: var(--r-sm); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow-y: auto; color: var(--muted); }

/* Tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .6875rem; font-weight: 700; color: var(--text); padding: var(--s2) var(--s3); background: var(--thead); white-space: nowrap; box-shadow: inset 0 -2px 0 var(--amber); }
td { padding: 6px var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--zebra); }
tbody tr:hover td { background: var(--hover); }
.num { text-align: right; white-space: nowrap; }
td.bad { color: var(--rust); font-weight: 600; } td.okc { color: var(--teal); }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; z-index: 20; width: min(46rem, 100vw); height: 100vh; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line2); box-shadow: var(--shadow); transform: translateX(102%); visibility: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s linear .2s; }
.drawer.open { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(4,6,9,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.show { opacity: 1; pointer-events: auto; }
.dh { position: sticky; top: 0; z-index: 2; padding: var(--s5) 3.5rem var(--s4) var(--s6); background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--amber); }
.dh h2 { margin: var(--s1) 0 0; font-size: 1.375rem; font-weight: 700; font-stretch: condensed; line-height: 1.15; }
.dh .close { position: absolute; top: var(--s3); right: var(--s3); width: var(--h); height: var(--h); background: none; border: 0; color: var(--muted); font-size: 1.25rem; }
.db { padding: var(--s4) var(--s6) 3rem; display: grid; gap: var(--s4); }
.db textarea { width: 100%; min-height: 26rem; background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: var(--s3); font: .8125rem/1.5 var(--mono); color: var(--text); resize: vertical; }
.steps { margin: 0; padding-left: 1.2rem; display: grid; gap: var(--s1); }
.rsec { display: grid; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
.rhd { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.rhd h4 { margin: 0; font-size: .75rem; font-weight: 700; color: var(--muted); font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }
.db textarea.rta { min-height: 4.5rem; resize: vertical; font: .875rem/1.5 var(--font); overflow: hidden; }
.db textarea.rta.one { min-height: 0; font-weight: 600; }
.steps-ed { display: grid; gap: var(--s2); }
.rsec > .link { justify-self: start; }
.steprow { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto auto; gap: var(--s2); align-items: center; }
.steprow .sn { width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border-radius: 50%; background: var(--raise2); color: var(--amber); font-weight: 700; font-size: .8125rem; }
.steprow .inp { min-width: 0; width: 100%; }
.iconx { width: var(--h-sm); height: var(--h-sm); background: none; border: 0; color: var(--muted); border-radius: var(--r-sm); }
.iconx:hover { color: var(--rust); background: var(--hover); }

/* Library */
.lib { display: grid; gap: var(--s2); margin-top: var(--s3); }
.lib details { padding: var(--s3) var(--s4); }
.lib summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; font-weight: 600; }
.lib summary span.t { flex: 1 1 20rem; }

/* About */
.about { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--s5); align-items: start; padding: var(--s5) var(--s6); }
.about img { width: 9rem; height: 9rem; object-fit: cover; border-radius: var(--r); border: 1px solid var(--line2); }
.about h2 { margin: 0; font-size: 1.5rem; font-stretch: condensed; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--s3); }
.tile { padding: var(--s4); display: grid; gap: var(--s1); text-decoration: none; color: var(--text); }
.tile:hover { border-color: var(--amber-line); color: var(--text); }
.tile b { font-size: 1rem; } .tile span { color: var(--muted); font-size: .875rem; }
.tile .go { color: var(--teal); font-weight: 600; font-size: .875rem; }
.promo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s5); align-items: center; padding: var(--s4) var(--s5); text-decoration: none; color: var(--text); }
.promo:hover { border-color: var(--amber-line); color: var(--text); }
.promo b { font-size: 1.0625rem; } .promo > span:not(.btn) { grid-column: 1; color: var(--muted); font-size: .875rem; }
.promo .eyebrow { color: var(--amber); }
.promo .btn { grid-column: 2; grid-row: 1 / span 3; }
.setcard { padding: var(--s5); display: grid; gap: var(--s3); }
.setcard h4 { margin: 0; font-size: 1.0625rem; }
.setcard p { margin: 0; max-width: 80ch; }
.cmd { display: inline-flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); background: var(--well); border: 1px solid var(--line2); border-radius: var(--r-sm); font: 1rem var(--mono); color: var(--text); justify-self: start; }
.state { display: inline-flex; align-items: center; gap: var(--s2); font-size: .875rem; font-weight: 600; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.state.on { color: var(--teal); } .state.on i { background: var(--teal); }
table.switches td { vertical-align: middle; }
table.switches td .sub { display: block; }
table.switches td:last-child { white-space: nowrap; }
.cmdsm { font: .875rem var(--mono); color: var(--text); background: var(--well); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 2px 6px; white-space: nowrap; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: var(--s2); max-width: 85ch; }
.foot { margin-top: var(--s7); color: var(--muted); font-size: .8125rem; display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }

.chipt { display: inline-flex; align-items: center; gap: var(--s2); height: var(--h); padding: 0 var(--s3) 0 var(--s2); border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--field); font-size: .875rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.chipt:hover { color: var(--text); border-color: var(--muted); }
.chipt input { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 0; border: 1.5px solid var(--line2); border-radius: 2px; background: var(--field); }
.chipt input:checked { background: var(--amber); border-color: var(--amber); box-shadow: inset 0 0 0 2px var(--field); }
.chipt:has(input:checked) { color: var(--text); border-color: var(--amber-line); }
.chipt:has(input:focus-visible) { outline: 2px solid var(--amber); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: var(--s5); transform: translateX(-50%); z-index: 30; padding: var(--s3) var(--s5); background: var(--raise2); border: 1px solid var(--line2); border-left: 3px solid var(--teal); border-radius: var(--r-sm); box-shadow: var(--shadow); max-width: min(40rem, 90vw); }
.toast.err { border-left-color: var(--rust); }
.empty { margin-top: var(--s4); padding: var(--s7) var(--s6); text-align: center; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); }
.empty h3 { margin: 0 0 var(--s1); color: var(--text); font-size: 1.0625rem; }
.empty p { margin: 0 auto; max-width: 60ch; }

@media (max-width: 760px) {
  .wrap { padding: 0 var(--s4) 4rem; }
  .tabbar { margin: var(--s4) calc(-1 * var(--s4)) 0; padding: 0 var(--s2); }
  .hero { grid-template-columns: 1fr; padding: var(--s5); justify-items: start; }
  .dial { width: 8.5rem; height: 8.5rem; }
  .summary { font-size: 1.125rem; }
  .about { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="15" cy="15" r="12"/><path d="M5 17h5l3-7 4 12 3-7h5" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
    <div><h1>Shard status</h1><p>SC Shard Status v__VERSION__ · by Aurelius_Draco</p></div>
  </div>
  <span class="grow"></span>
  <a class="pill plink" href="https://github.com/Aurelius-Draco/sc-inventory-tracker/releases/latest" target="_blank" rel="noopener" title="Free download on GitHub">Get SC Inventory Tracker</a>
  <span class="pill" id="shardPill"><i></i><span>No shard yet</span></span>
  <span class="pill" id="ovPill" title="Reading the game's debug overlay"><i></i><span>Overlay</span></span>
</header>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="now" aria-selected="true">Now</button>
  <button role="tab" data-tab="check">What's gone wrong? <span class="count rust" id="findCount"></span></button>
  <button role="tab" data-tab="history">History</button>
  <button role="tab" data-tab="pc">My PC</button>
  <button role="tab" data-tab="issues">Known issues <span class="count" id="libCount"></span></button>
  <button role="tab" data-tab="setup" class="t2 tsetup"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Set up <i class="dot" id="setupDot" hidden></i></button>
  <button role="tab" data-tab="about">About</button>
</nav>

<main id="view"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="dTitle">
  <div class="dh"><div class="eyebrow" id="dEyebrow">Issue Council draft</div><h2 id="dTitle"></h2><button class="close" id="dClose" aria-label="Close">✕</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 0) => v === null || v === undefined ? "–" : Number(v).toFixed(d);
const tm = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const dtm = ts => ts ? new Date(ts * 1000).toLocaleString([], {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
const ago = ts => { if (!ts) return ""; const s = Date.now() / 1000 - ts; if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago"; };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {"X-Token": TOKEN}} :
    {method: "POST", headers: {"X-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

let tab = "now", nowData = null, lastCheck = null, timer = null;
try { tab = sessionStorage.getItem("tab") || "now"; } catch (e) {}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => show(b.dataset.tab));

function show(t) {
  tab = t;
  try { sessionStorage.setItem("tab", t); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  clearInterval(timer);
  const fn = {now: renderNow, check: renderCheck, history: renderHistory, pc: renderPC, issues: renderIssues, setup: renderSetup, about: renderAbout}[t] || renderNow;
  Promise.resolve().then(fn).catch(e => {
    if (tab === t) $("view").innerHTML = `<div class="empty"><h3>Couldn't load this page</h3><p>${esc(e.message)}. Is the SC Shard Status window still open?</p></div>`;
  });
  if (t === "now") timer = setInterval(() => {
    // Don't rebuild the page under someone reading a tooltip or a report
    if (document.querySelector("#view .tip:not([hidden])") || $("drawer").classList.contains("open")) return;
    renderNow();
  }, 5000);
}

/* ---------- header ---------- */
function header(d) {
  const sp = $("shardPill"), op = $("ovPill");
  const sh = d.shard || {};
  sp.className = "pill" + (sh.id ? " on" : "");
  sp.querySelector("span").textContent = sh.id ? `${sh.id}  ·  ${sh.region}` : (d.game_found ? "Not in the PU yet" : "Game.log not found");
  const st = d.overlay_status || "off";
  op.className = "pill" + (st === "reading" ? " on" : st === "off" ? "" : " warn");
  op.querySelector("span").textContent = st === "reading" ? "Overlay: reading" : st === "off" ? "Overlay: off" : "Overlay: " + st.split(" (")[0];
  op.title = st;
  $("libCount").textContent = d.library && d.library.problem ? d.library.problem : "";
  const dot = $("setupDot"); dot.hidden = !!d.game_found; dot.title = d.game_found ? "" : "Game folder not found";
}

/* ---------- charts ---------- */
function lineChart(el, pts, key, color, unit, label) {
  const data = pts.filter(p => p[key] !== null && p[key] !== undefined);
  if (data.length < 2) { el.innerHTML = `<div class="nochart">Not enough readings yet</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 144, L = 34, R = 8, T = 8, B = 20;
  const xs = data.map(p => p.ts), ys = data.map(p => p[key]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y1 = Math.max(...ys) * 1.15 || 1; const y0 = 0;
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p) * p; };
  y1 = nice(y1);
  const X = t => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const ticks = [0, y1 / 2, y1];
  let path = data.map((p, i) => (i ? "L" : "M") + X(p.ts).toFixed(1) + " " + Y(p[key]).toFixed(1)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} over the last hour">
    <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t => `<text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
      <text x="${L}" y="${H - 4}">${tm(x0)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${tm(x1)}</text></g>
    <path class="ln" d="${path}" stroke="${color}"/>
    <line class="xh" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="dot" r="4.5" fill="${color}" visibility="hidden"/>
    <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot"), tip = el.querySelector(".tip");
  const move = e => {
    const r = svg.getBoundingClientRect(); const mx = (e.clientX - r.left) * W / r.width;
    let best = data[0]; for (const p of data) if (Math.abs(X(p.ts) - mx) < Math.abs(X(best.ts) - mx)) best = p;
    const px = X(best.ts), py = Y(best[key]);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = (px * r.width / W) + "px"; tip.style.top = (py * r.height / H) + "px";
    tip.innerHTML = `<b>${tm(best.ts)}</b>${fmt(best[key], key.includes("fps") ? 1 : 0)} ${esc(unit)}`;
  };
  svg.querySelector(".hit").addEventListener("pointermove", move);
  svg.querySelector(".hit").addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
}

function barChart(el, rows, key, color, unit) {
  if (!rows.length) { el.innerHTML = `<div class="nochart">No readings yet</div>`; return; }
  const W = el.clientWidth || 400, H = el.clientHeight || 144, L = 34, R = 8, T = 8, B = 20;
  const max = Math.max(...rows.map(r => r[key])) * 1.15 || 1;
  const bw = (W - L - R) / 24;
  const Y = v => T + (H - T - B) * (1 - v / max);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Server fps by hour of day">
    <g class="grid"><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/></g>
    <g class="axis">${[0, 6, 12, 18].map(h => `<text x="${L + bw * h + bw / 2}" y="${H - 4}" text-anchor="middle">${String(h).padStart(2, "0")}:00</text>`).join("")}
      <text x="${L - 6}" y="${Y(max / 1.15) + 4}" text-anchor="end">${Math.round(max / 1.15)}</text></g>
    ${rows.map(r => { const x = L + bw * r.hour + 1, y = Y(r[key]), h = Y(0) - y;
      return `<path d="M${x} ${Y(0)} V${y + 4} q0 -4 4 -4 H${x + bw - 6} q4 0 4 4 V${Y(0)} Z" fill="${color}"/>
        <rect class="hit" x="${L + bw * r.hour}" y="${T}" width="${bw}" height="${H - T - B}" data-h="${r.hour}"/>`; }).join("")}
  </svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("pointerenter", () => { const r = rows.find(x => x.hour == h.dataset.h), sr = svg.getBoundingClientRect();
      tip.hidden = false; tip.style.left = ((L + bw * r.hour + bw / 2) * sr.width / W) + "px"; tip.style.top = (Y(r[key]) * sr.height / H) + "px";
      tip.innerHTML = `<b>${String(r.hour).padStart(2, "0")}:00 to ${String(r.hour + 1).padStart(2, "0")}:00</b>${fmt(r[key], 1)} ${unit} · ${r.readings} readings`; });
    h.addEventListener("pointerleave", () => tip.hidden = true);
  });
}

/* ---------- Now ---------- */
function cls(v, good, warn) { if (v === null || v === undefined) return ""; return v >= good ? "good" : v >= warn ? "warn" : "rust"; }
function clsLow(v, good, warn) { if (v === null || v === undefined) return ""; return v <= good ? "good" : v <= warn ? "warn" : "rust"; }

async function renderNow() {
  let d;
  try { d = await api("/api/now"); } catch (e) { $("view").innerHTML = `<div class="empty"><h3>Lost contact with the app</h3><p>${esc(e.message)}. Is the SC Shard Status window still open?</p></div>`; return; }
  nowData = d; header(d);
  if (tab !== "now") return;
  const h = d.health, s = d.session || {}, sh = d.shard || {};
  const score = h.score, circ = 2 * Math.PI * 52, frac = score === null ? 0 : score / 100;
  const col = {good: "var(--teal)", ok: "var(--fresh)", poor: "var(--amber)", bad: "var(--rust)"}[h.cls] || "var(--line2)";
  const setup = [];
  if (!d.game_found) setup.push(`<div class="notice rust"><p><b>Game folder not found yet.</b> Start Star Citizen and the app picks it up by itself, or paste the folder on the Set up tab.</p><button class="btn sm" id="goSetup3">Set up</button></div>`);
  if (h.score === null && d.overlay_status !== "off" && d.user_cfg && !d.user_cfg.has_displayinfo)
    setup.push(`<div class="notice"><p><b>Turn on the game's overlay.</b> In game, open the console with <kbd>~</kbd> and type <code>r_displayinfo 3</code>. Or add it to USER.cfg so it's always on. The Set up tab explains both settings.</p><button class="btn sm ghost" id="addCfg">Add to USER.cfg</button><button class="btn sm ghost" id="goSetup">Set up</button></div>`);
  const cmp = d.compare;
  const cmpTxt = cmp ? `${Math.abs(cmp.diff_pct)}% ${cmp.diff_pct >= 0 ? "above" : "below"} your usual ${cmp.your_median} fps on this patch` : "";
  $("view").innerHTML = `
  <section class="hero frame">
    <div class="dial" role="img" aria-label="Shard health ${score ?? "unknown"} out of 100">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(circ * frac).toFixed(1)} ${circ.toFixed(1)}"/></svg>
      <div class="val"><b>${score ?? "–"}</b><span>health / 100</span></div>
    </div>
    <div class="hmain">
      <span class="verdict v-${h.cls}"><i></i>${esc(h.label)}</span>
      <p class="summary">${esc(h.summary)}</p>
      ${h.points && h.points.length ? `<ul class="tips">${h.points.map(p => `<li class="notice"><p>${esc(p)}</p></li>`).join("")}</ul>` : ""}
      <div class="shardline">${sh.id ? `<span>Shard <code>${esc(sh.id)}</code></span><span>${esc(sh.region)}</span>` : ""}
        ${h.server_name ? `<span>Server <code>${esc(h.server_name.split("-").slice(-2).join("-"))}</code></span>` : ""}
        ${h.location ? `<span>At <code>${esc(h.location)}</code></span>` : ""}
        ${h.ts ? `<span>Last reading ${ago(h.ts)}</span>` : ""}${cmpTxt ? `<span>${esc(cmpTxt)}</span>` : ""}</div>
    </div>
  </section>
  ${setup.length ? `<div class="sec" style="display:grid;gap:var(--s2)">${setup.join("")}</div>` : ""}
  <section class="sec"><h3>Live numbers <span>from the game's overlay, median of the last 5 minutes</span></h3>
    <dl class="readout">
      <div class="cell ${cls(h.server_fps, 18, 10)}"><dt>Server fps</dt><dd>${fmt(h.server_fps, 1)}${h.server_fps_low != null ? `<small>low ${fmt(h.server_fps_low, 1)}</small>` : ""}</dd></div>
      <div class="cell"><dt>Players on shard</dt><dd>${fmt(h.pop_shard)}</dd></div>
      <div class="cell"><dt>On your server</dt><dd>${fmt(h.pop_srv)}</dd></div>
      <div class="cell ${clsLow(h.ping_ms, 80, 200)}"><dt>Ping</dt><dd>${fmt(h.ping_ms)}<small>ms</small></dd></div>
      <div class="cell ${clsLow(h.loss_pct, 0.4, 2)}"><dt>Packet loss</dt><dd>${h.loss_pct == null ? "–" : h.loss_pct + "%"}</dd></div>
      <div class="cell ${clsLow(h.hitches, 0, 3)}"><dt>Hitches</dt><dd>${fmt(h.hitches)}</dd></div>
      <div class="cell ${clsLow(h.restarts, 0, 0)}"><dt>Restarts while on</dt><dd>${fmt(h.restarts)}</dd></div>
      <div class="cell"><dt>Your fps</dt><dd>${fmt(h.client_fps)}</dd></div>
    </dl>
  </section>
  <section class="sec grid2">
    <div class="frame card"><h4>Server fps</h4><span class="sub">Last hour. About 20 is normal on 4.10.</span><div class="chart" id="cFps"></div></div>
    <div class="frame card"><h4>Players on your server</h4><span class="sub">Last hour. The server node you're on, not the whole shard.</span><div class="chart" id="cPop"></div></div>
  </section>
  <section class="sec grid2">
    <div class="frame card"><h4>This session</h4>
      <dl class="readout" style="margin-top:var(--s3)">
        <div class="cell"><dt>Patch</dt><dd style="font-size:1.0625rem">${esc(s.version || "–")}</dd><span class="sub">build ${esc(s.build || "–")}</span></div>
        <div class="cell"><dt>Started</dt><dd style="font-size:1.0625rem">${tm(s.start) || "–"}</dd><span class="sub">${s.minutes ? Math.round(s.minutes) + " min" : ""}</span></div>
        <div class="cell"><dt>Load into PU</dt><dd style="font-size:1.0625rem">${s.load_s != null ? s.load_s + " s" : "–"}</dd></div>
        <div class="cell ${s.bad_disconnects ? "rust" : ""}"><dt>Disconnects</dt><dd style="font-size:1.0625rem">${s.bad_disconnects ?? 0}</dd><span class="sub">not counting normal exits</span></div>
      </dl></div>
    <div class="frame card"><h4>Active contracts</h4>
      ${d.contracts && d.contracts.length ? `<ul class="steps" style="margin-top:var(--s2)">${d.contracts.map(c => `<li><b>${esc(c.name)}</b>${c.times > 1 ? ` <span class="sub">taken ${c.times} times</span>` : ""}${Object.values(c.objectives || {}).length ? `<div class="sub">${Object.values(c.objectives).map(o => esc(o.text) + (o.state === "complete" ? " ✓" : "")).join("<br>")}</div>` : ""}</li>`).join("")}</ul>` : `<p class="sub">None accepted this session.</p>`}
    </div>
  </section>
  <section class="sec"><a class="frame promo" href="https://github.com/Aurelius-Draco/sc-inventory-tracker/releases/latest" target="_blank" rel="noopener">

async function renderCheck() {
  if (!lastCheck) { try { const r = await api("/api/last"); if (r && r.findings) lastCheck = r; } catch (e) {} }
  const mins = (() => { try { return sessionStorage.getItem("mins") || "30"; } catch (e) { return "30"; } })();
  $("view").innerHTML = `
  <section class="checkbar frame">
    <button class="btn big" id="runCheck">What's gone wrong?</button>
    <label class="sub">Look back <select id="mins">${[10, 30, 60, 120, 240].map(m => `<option value="${m}" ${m == mins ? "selected" : ""}>${m < 60 ? m + " minutes" : m / 60 + " hour" + (m > 60 ? "s" : "")}</option>`).join("")}</select></label>
    <p>Reads Game.log and the overlay readings for that period, matches them against the known-issues library and explains what it finds.</p>
  </section>
  <div id="checkOut">${lastCheck ? "" : `<div class="empty"><h3>Nothing checked yet</h3><p>Something just went wrong in game? Press the button. You don't need to quit the game first.</p></div>`}</div>`;
  $("mins").onchange = e => { try { sessionStorage.setItem("mins", e.target.value); } catch (x) {} };
  $("runCheck").onclick = runCheck;
  if (lastCheck) drawCheck(lastCheck);
}

async function runCheck() {
  const b = $("runCheck"); b.disabled = true; b.textContent = "Checking…";
  try { lastCheck = await api("/api/diagnose", {minutes: +$("mins").value}); drawCheck(lastCheck); }
  catch (e) { toast(e.message, true); }
  b.disabled = false; b.textContent = "What's gone wrong?";
}

function findCard(f, i, group) {
  const when = f.first_ts ? (f.first_ts === f.last_ts || !f.last_ts ? tm(f.first_ts) : `${tm(f.first_ts)} to ${tm(f.last_ts)}`) : "";
  return `<article class="find frame ${group === "unknown" ? "" : esc(f.severity)}">
    <div class="fh"><h4>${esc(f.title)}</h4>
      <span class="chip ${group === "unknown" ? "unknown" : esc(f.severity)}">${group === "unknown" ? "unrecognised" : esc(f.severity)}</span>
      ${f.area && group !== "unknown" ? `<span class="chip area">${esc(f.area)}</span>` : ""}
      <span class="sub">${f.count > 1 ? f.count + " times, " : ""}${when}</span></div>
    ${group === "unknown" ? `<p class="sub">Not in the known-issues library yet. It may well be harmless; the game logs plenty of errors in a normal session.</p>` : `<p>${esc(f.explain)}</p>`}
    ${f.fixes && f.fixes.length ? `<ul>${f.fixes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${f.links && f.links.length ? `<p class="sub">${f.links.map(l => `<a href="${esc(l.url || l)}" target="_blank" rel="noopener">${esc(l.title || l.url || l)}</a>`).join(" · ")}</p>` : ""}
    ${f.examples && f.examples.length ? `<details class="ex"><summary>Log lines (${f.examples.length})</summary><pre class="lines">${esc(f.examples.join("\n"))}</pre></details>` : ""}
    <div class="fa">
      ${group === "unknown" ? `<button class="btn sm ghost" data-review="${i}">Prepare for review</button>` : ""}
      <button class="btn sm ghost" data-report="${i}" data-group="${group}">Issue Council draft</button>
    </div></article>`;
}

function drawCheck(r) {
  const out = $("checkOut"); if (!out) return;
  const hi = r.findings.filter(f => f.severity === "high").length;
  $("findCount").textContent = hi || "";
  out.innerHTML = `
    <p class="headline">${esc(r.headline)}</p>
    <p class="sub">Checked ${r.lines_checked.toLocaleString()} log lines${r.logs && r.logs.length > 1 ? ` across ${r.logs.length} game sessions` : ""} from ${tm(r.since)} (${r.noise_lines.toLocaleString()} were known harmless messages). ${r.session.shard_id ? "Shard " + esc(r.session.shard_id) + "." : ""}</p>
    ${r.findings.length ? `<div class="finds">${r.findings.map((f, i) => findCard(f, i, "findings")).join("")}</div>` : `<div class="empty"><h3>No known problems</h3><p>Nothing in the library matched. If something still feels wrong, check the server fps on the Now tab: a slow server causes most "nothing works" moments without logging an error.</p></div>`}
    ${r.unknown.length ? `<section class="sec"><h3>Unrecognised errors <span>${r.unknown.length} kinds. Probably harmless, but if one lines up with your problem, send it for review.</span></h3>
      <details><summary class="link" style="cursor:pointer">Show them</summary><div class="finds">${r.unknown.slice(0, 40).map((f, i) => findCard(f, i, "unknown")).join("")}</div></details></section>` : ""}`;
  out.querySelectorAll("[data-report]").forEach(b => b.onclick = () => openReport(b.dataset.group, +b.dataset.report));
  out.querySelectorAll("[data-review]").forEach(b => b.onclick = () => openReview(+b.dataset.review));
}

function openDrawer(eyebrow, title, html) {

}
function closeDrawer() { $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("show"); }

async function copyText(t, what) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(`${what} copied. Paste it into the matching box on the Issue Council.`);
}
const grow = el => { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; };

function reportText() {
  const out = [];
  $("dBody").querySelectorAll("[data-sec]").forEach(sec => {
    const label = sec.dataset.label.toUpperCase();
    if (sec.dataset.sec === "steps") {
      const steps = [...sec.querySelectorAll("input.step")].map(x => x.value.trim()).filter(Boolean);
      out.push(label + "\n" + steps.map((x, n) => `${n + 1}. ${x}`).join("\n"));
    } else out.push(label + "\n" + sec.querySelector("textarea").value.trim());
  });
  return out.join("\n\n") + "\n\nATTACHMENTS\nGame.log from this session, plus screenshots if I took any.\n";
}

function stepRow(text, n) {
  return `<div class="steprow"><span class="sn">${n}</span><input class="inp step" value="${esc(text)}" aria-label="Step ${n}">
    <button class="btn sm ghost" data-copystep title="Copy step ${n}">Copy</button><button class="iconx" data-delstep aria-label="Remove step ${n}">✕</button></div>`;
}

async function openReport(group, i) {
  let d;
  try { d = await api("/api/report", {group, i}); } catch (e) { return toast(e.message, true); }
  const secHtml = d.sections.map(sec => sec.key === "steps"
    ? `<section class="rsec" data-sec="steps" data-label="${esc(sec.label)}"><div class="rhd"><h4>${esc(sec.label)}</h4>
        <button class="btn sm" data-copyall>Copy all steps</button></div>
        <p class="sub">The Issue Council takes one step per box. Copy each one into its own box.</p>
        <div class="steps-ed">${sec.steps.map((x, n) => stepRow(x, n + 1)).join("")}</div>
        <button class="link" data-addstep>Add a step</button></section>`
    : `<section class="rsec" data-sec="${esc(sec.key)}" data-label="${esc(sec.label)}"><div class="rhd"><h4>${esc(sec.label)}</h4>
        <button class="btn sm" data-copy>Copy</button></div>
        <textarea class="rta${sec.key === "title" ? " one" : ""}" spellcheck="true" aria-label="${esc(sec.label)}">${esc(sec.text)}</textarea></section>`).join("");
  openDrawer("Issue Council draft", d.title, `
    <ol class="steps">
      <li>Search the Issue Council first. If someone has already reported it, add your confirmation there instead of a new report.</li>
      <li>Check each part below and fill in anything in brackets. Edits here go into the copies and the report folder.</li>
      <li>Copy each part into the matching box on the Issue Council, then attach the files from the report folder.</li>
    </ol>
    <div class="fa"><a class="btn ghost" href="${esc(d.url)}" target="_blank" rel="noopener">Open the Issue Council</a>
      <button class="btn ghost" id="icFolder">Make report folder</button><button class="btn ghost" id="icAll">Copy whole report</button></div>
    ${secHtml}
    <p class="sub">This tool never sends anything to CIG. You submit the report yourself. The summary ends with a line saying this tool compiled the data, so CIG knows where it came from. The report folder includes your own Game.log, which is fine: that's you reporting to them.</p>`);
  const body = $("dBody");
  body.querySelectorAll("textarea.rta").forEach(t => { grow(t); t.addEventListener("input", () => grow(t)); });
  const renumber = () => body.querySelectorAll(".steprow").forEach((r, n) => { r.querySelector(".sn").textContent = n + 1; });
  body.addEventListener("click", e => {
    const t = e.target, sec = t.closest("[data-sec]");
    if (t.matches("[data-copy]")) copyText(sec.querySelector("textarea").value.trim(), sec.dataset.label);
    else if (t.matches("[data-copystep]")) { const r = t.closest(".steprow"); copyText(r.querySelector("input").value.trim(), "Step " + r.querySelector(".sn").textContent); }
    else if (t.matches("[data-copyall]")) copyText([...sec.querySelectorAll("input.step")].map(x => x.value.trim()).filter(Boolean).map((x, n) => `${n + 1}. ${x}`).join("\n"), "All steps");
    else if (t.matches("[data-delstep]")) { t.closest(".steprow").remove(); renumber(); }
    else if (t.matches("[data-addstep]")) { const box = sec.querySelector(".steps-ed"); box.insertAdjacentHTML("beforeend", stepRow("", box.children.length + 1)); box.lastElementChild.querySelector("input").focus(); }
  });
  $("icAll").onclick = () => copyText(reportText(), "Whole report");
  $("icFolder").onclick = async () => { try { const r = await api("/api/bundle", {group, i, open: true, text: reportText()}); toast(`Report folder made with ${r.screenshots} screenshot${r.screenshots === 1 ? "" : "s"}: ${r.folder}`); } catch (e) { toast(e.message, true); } };
}

/* ---------- Known issues ---------- */
// Library text has blanks the app fills from the log line ({item_name}); in the list, show them as plain words
const BLANKS = {item_name: "an item", vehicle: "a ship", task: "a step", which: "", seconds: "N", metres: "N",
  pct: "N", commit_mb: "N", left_mb: "N", from: "one point", to: "another", manager: "", reason: "the reason given"};
function generic(t) {
  return String(t || "").replace(/\s*\(\{\w+\}\)/g, "").replace(/\{(\w+)\}/g, (m, k) => k in BLANKS ? BLANKS[k] : "…")
    .replace(/\s{2,}/g, " ").replace(/\s+([.,:])/g, "$1").trim();
}

        <td>${st(u.has_sessioninfo, "On", "Off")} <button class="btn sm ghost" ${u.game_found === false ? "disabled" : ""} data-cfg="r_DisplaySessionInfo" data-on="${u.has_sessioninfo ? "0" : "1"}">${u.has_sessioninfo ? "Start with it off" : "Start with it on"}</button></td></tr>
    </tbody></table></div>
    <p class="sub"><b>Shortcut:</b> the console remembers what you typed. Press <kbd>~</kbd>, then the <kbd>Up</kbd> arrow to bring back an earlier command, and <kbd>Enter</kbd> to run it. Flicking the overlay on and off becomes two or three key presses.</p>
    <p class="sub"><b>Screenshot-only?</b> Leave both off at start-up. When you want a reading, switch the overlay on, press <kbd>Esc</kbd> then <kbd>Print Screen</kbd>, and switch it off again.</p>
  </section>
  <section class="sec frame setcard">
    <h4>1. The performance overlay (needed for the live health numbers)</h4>
    <span class="cmd">r_displayinfo 3</span>
    <p>Shows a block of small text in the top right: server fps, players on the shard and on your server, ping, packet loss, hitches, server restarts, your own fps and where you are. The app reads this off the screen every few seconds while the game is in front. Levels 2, 3 and 4 show the same block in 4.10; <code>r_displayinfo 0</code> turns it off.</p>
    <div class="fa">${st(u.has_displayinfo, "On in USER.cfg", "Not in USER.cfg")}
      <button class="btn sm ${u.has_displayinfo ? "ghost" : ""}" ${u.game_found === false ? "disabled" : ""} data-cfg="r_displayinfo" data-on="${u.has_displayinfo ? "0" : "1"}">${u.has_displayinfo ? "Turn off in USER.cfg" : "Add to USER.cfg"}</button></div>
  </section>
  <section class="sec frame setcard">
    <h4>2. The session QR code (recommended for Issue Council reports)</h4>
    <span class="cmd">r_DisplaySessionInfo 1</span>
    <p>Puts a small QR code in the top right corner. It holds your session id, shard and the exact time, which is what CIG's QA team uses to find your session on their side, so any screenshot you take becomes far more useful in a bug report. The Star Citizen wiki's bug reporting guide recommends it. You can also switch it on in the game's Graphics settings. The app copes with it: the overlay block moves left to make room and is still read.</p>
    <p class="sub">The QR code identifies your session, so blur it in screenshots you post publicly (Spectrum, Discord, Reddit). It's fine in Issue Council reports, which go to CIG.</p>
    <div class="fa">${st(u.has_sessioninfo, "On in USER.cfg", "Not in USER.cfg")}
      <button class="btn sm ${u.has_sessioninfo ? "ghost" : ""}" ${u.game_found === false ? "disabled" : ""} data-cfg="r_DisplaySessionInfo" data-on="${u.has_sessioninfo ? "0" : "1"}">${u.has_sessioninfo ? "Turn off in USER.cfg" : "Add to USER.cfg"}</button></div>
  </section>
  <section class="sec frame setcard">
    <h4>3. Screenshots</h4>
    <p>Press <kbd>Print Screen</kbd> in game. The game saves them in <code>StarCitizen\\LIVE\\screenshots</code>. Any screenshot with the overlay on it becomes a reading, and the app picks up screenshots taken around the time of a problem when it makes an Issue Council report folder.</p>
  </section>
  <section class="sec frame setcard">
    <h4>Tips for clean readings</h4>
    <ul class="rules">
      <li><b>Dark behind the text reads best.</b> The overlay is thin light text. Over the sun, a bright planet, snow, lights or a white wall it washes out and the reading is skipped. Face something dark (space, a ship interior, a dark wall or floor) when you want a reading.</li>
      <li><b>Quickest trick for screenshots:</b> press <kbd>Esc</kbd> first. The game menu darkens the whole screen behind the overlay, then press <kbd>Print Screen</kbd>. The game keeps running while the menu is open.</li>
      <li><b>Keep the top right corner clear.</b> Move other overlays (Discord, Steam, NVIDIA or AMD performance counters, RivaTuner) to another corner so they don't sit on top of the game's text.</li>
      <li><b>Turn off Chromatic Aberration and Film Grain</b> in the game's Graphics settings. Both blur small text.</li>
      <li><b>1440p or higher reads every value reliably.</b> At 1080p the text is tiny; the main numbers still read, but the odd small value can be misread. The app takes the middle value over a few minutes, so one bad reading doesn't change the score.</li>
      <li><b>Play on your main monitor,</b> or set <code>monitor</code> in <code>data\\config.json</code> to the screen the game is on.</li>
      <li>Live reading skips anything it can't read and tries again 5 seconds later, so a bright moment just means a gap, not a wrong number.</li>
    </ul>
  </section>
  <section class="sec frame setcard">
    <h4>How readings are taken</h4>
    <p><b>Live</b> reads the overlay corner of your screen every 5 seconds while the game is in front. That gives the health score, the charts and warnings when the server slows down. <b>Screenshots</b> reads only the screenshots you take, so nothing watches your screen; you get a reading each time you press <kbd>Print Screen</kbd>, but no live score.</p>
    <div class="fa" id="setToggles"></div>
  </section>
  <section class="sec"><p class="sub">USER.cfg lives in your StarCitizen\\LIVE folder${u.path ? ` (<code>${esc(u.path)}</code>)` : ""}. Before each change the app saves the file as it was to USER.cfg.bak. Changes take effect the next time the game starts; type the command in the console to use it straight away.</p></section>`;
  $("gdSave").onclick = async () => {
    try { const r = await api("/api/gamedir", {path: $("gdPath").value}); toast(r.message); nowData = await api("/api/now"); renderSetup(); }
    catch (e) { toast(e.message, true); }
  };
  const drawToggles = async () => {
    const st = await api("/api/settings");
    $("setToggles").innerHTML = `
      <label class="chipt"><input type="checkbox" id="tgLive" ${st.live ? "checked" : ""}> Live screen reading</label>
      <label class="chipt"><input type="checkbox" id="tgShots" ${st.screenshots ? "checked" : ""}> Read my screenshots</label>
      <span class="sub">${st.live !== st.live_running ? "Restart the app to apply." : st.screenshot_readings ? st.screenshot_readings + " readings from screenshots this run." : ""}</span>`;
    const save = async () => { try { const r = await api("/api/settings", {live: $("tgLive").checked, screenshots: $("tgShots").checked}); toast(r.message); drawToggles(); } catch (e) { toast(e.message, true); } };
    $("tgLive").onchange = save; $("tgShots").onchange = save;
  };
  drawToggles();
  $("view").querySelectorAll("[data-cfg]").forEach(b => b.onclick = async () => {
    try { const r = await api("/api/usercfg", {name: b.dataset.cfg, on: b.dataset.on === "1"}); toast(r.message); nowData = null; nowData = await api("/api/now"); renderSetup(); }
    catch (e) { toast(e.message, true); }
  });
}

/* ---------- About ---------- */
async function renderAbout() {
  const d = await api("/api/about");
  if (tab !== "about") return;
  const theme = document.documentElement.dataset.theme || "";
  $("view").innerHTML = `
  <section class="sec frame about">
    ${d.author.picture ? `<img src="${esc(d.author.picture)}" alt="Aurelius_Draco">` : ""}
    <div><span class="eyebrow">Made by</span><h2>${esc(d.author.name)}</h2>${d.message.map(m => `<p>${esc(m)}</p>`).join("")}</div>
  </section>
  <section class="sec"><h3>Also by Aurelius_Draco</h3><div class="tiles">
    ${d.also_by.map(a => `<a class="frame tile" href="${esc(a.download || a.url)}" target="_blank" rel="noopener"><b>${esc(a.name)}</b><span>${esc(a.about)}</span><span class="go">Download from GitHub →</span></a>`).join("")}
  </div></section>
  <section class="sec"><h3>Say hello</h3><div class="tiles">
    ${d.links.map(l => `<a class="frame tile" href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.title)}</b><span>${esc(l.text)}</span><span>${esc(l.about)}</span></a>`).join("")}
    <a class="frame tile" href="${esc(d.author.repo)}" target="_blank" rel="noopener"><b>This app on GitHub</b><span>Updates, source code, and where to report a problem or suggest an idea.</span></a>
  </div></section>
  <section class="sec"><h3>Ground rules</h3><ul class="rules">${d.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></section>
  <section class="sec"><h3>Look</h3><div class="seg" role="radiogroup" aria-label="Theme">
    ${[["", "Match Windows"], ["dark", "Dark"], ["light", "Light"]].map(([v, l]) => `<button type="button" data-theme="${v}" aria-pressed="${theme === v}">${l}</button>`).join("")}</div></section>
  <p class="foot">SC Shard Status v${esc(d.version)}</p>`;
  $("view").querySelectorAll("[data-theme]").forEach(x => x.onclick = () => {
    const t = x.dataset.theme;
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("theme", t); } catch (e) {}
    $("view").querySelectorAll("[data-theme]").forEach(y => y.setAttribute("aria-pressed", y === x));
  });
}

show(tab);
api("/api/now").then(header).catch(() => {});
</script>
